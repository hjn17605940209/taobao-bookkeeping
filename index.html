<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人记账 - Personal Bookkeeping</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <style>
        /* CSS Variables - Warm Tone Design */
        :root {
            --bg: #f7f5f0;
            --bg-card: #ffffff;
            --bg-secondary: #faf8f3;
            --accent: #c4501a;
            --accent-light: #e87a3d;
            --accent-dark: #9a3d14;
            --text-primary: #2d2a26;
            --text-secondary: #6b6560;
            --text-muted: #9a9590;
            --border: #e8e4de;
            --shadow: rgba(45, 42, 38, 0.08);
            --shadow-lg: rgba(45, 42, 38, 0.12);
            --income: #2d8a4e;
            --income-light: #e8f5ed;
            --expense: #c4501a;
            --expense-light: #fdf2ed;
            --transfer: #5b7ba3;
            --transfer-light: #eef2f7;
            --warning: #d4a017;
            --danger: #c41a1a;
            --success: #2d8a4e;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .animate-slide-in {
            animation: slideIn 0.4s ease-out forwards;
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            animation: fadeIn 0.5s ease-out;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1::before {
            content: '📊';
            font-size: 32px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .sync-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
            padding: 6px 12px;
            background: var(--bg-secondary);
            border-radius: 20px;
        }

        .sync-status.syncing::before {
            content: '';
            width: 12px;
            height: 12px;
            border: 2px solid var(--accent);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .sync-status.synced::before {
            content: '✓';
            color: var(--success);
            font-weight: bold;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(196, 80, 26, 0.3);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #a01515;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #236b3b;
        }

        .btn-large {
            padding: 16px 32px;
            font-size: 16px;
            border-radius: var(--radius);
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
        }

        /* Account Cards */
        .accounts-section {
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .account-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
            box-shadow: 0 2px 8px var(--shadow);
            animation: fadeIn 0.5s ease-out backwards;
        }

        .account-card:nth-child(1) { animation-delay: 0.1s; }
        .account-card:nth-child(2) { animation-delay: 0.15s; }
        .account-card:nth-child(3) { animation-delay: 0.2s; }
        .account-card:nth-child(4) { animation-delay: 0.25s; }
        .account-card:nth-child(5) { animation-delay: 0.3s; }

        .account-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--shadow-lg);
        }

        .account-card.active {
            border-color: var(--accent);
            background: var(--expense-light);
        }

        .account-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .account-name {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .account-balance {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .account-card.credit .account-balance {
            color: var(--expense);
        }

        /* Summary Cards */
        .summary-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .summary-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 2px 8px var(--shadow);
            animation: fadeIn 0.5s ease-out backwards;
            animation-delay: 0.35s;
        }

        .summary-card.income {
            border-left: 4px solid var(--income);
        }

        .summary-card.expense {
            border-left: 4px solid var(--expense);
        }

        .summary-card.balance {
            border-left: 4px solid var(--accent);
        }

        .summary-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-value {
            font-size: 28px;
            font-weight: 700;
        }

        .summary-card.income .summary-value {
            color: var(--income);
        }

        .summary-card.expense .summary-value {
            color: var(--expense);
        }

        .summary-card.balance .summary-value {
            color: var(--accent);
        }

        /* Budget Progress */
        .budget-progress {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: 0 2px 8px var(--shadow);
            animation: fadeIn 0.5s ease-out backwards;
            animation-delay: 0.4s;
        }

        .budget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .budget-title {
            font-weight: 600;
            font-size: 15px;
        }

        .budget-stats {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .progress-bar {
            height: 10px;
            background: var(--bg-secondary);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-light), var(--accent));
            border-radius: 5px;
            transition: width 0.6s ease;
            position: relative;
        }

        .progress-fill.warning {
            background: linear-gradient(90deg, var(--warning), #e6b800);
        }

        .progress-fill.danger {
            background: linear-gradient(90deg, var(--danger), #e02020);
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            animation: fadeIn 0.5s ease-out backwards;
            animation-delay: 0.45s;
        }

        .quick-btn {
            flex: 1;
            min-width: 140px;
            padding: 20px 24px;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .quick-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--shadow-lg);
        }

        .quick-btn.income {
            background: var(--income-light);
            color: var(--income);
        }

        .quick-btn.expense {
            background: var(--expense-light);
            color: var(--expense);
        }

        .quick-btn.transfer {
            background: var(--transfer-light);
            color: var(--transfer);
        }

        .quick-btn .icon {
            font-size: 32px;
        }

        .quick-btn .label {
            font-size: 15px;
            font-weight: 600;
        }

        /* Charts Section */
        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 24px;
            margin-bottom: 28px;
        }

        .chart-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 2px 8px var(--shadow);
            animation: fadeIn 0.5s ease-out backwards;
            animation-delay: 0.5s;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .chart-container {
            position: relative;
            height: 280px;
        }

        /* Transactions Section */
        .transactions-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 2px 8px var(--shadow);
            animation: fadeIn 0.5s ease-out backwards;
            animation-delay: 0.55s;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-bar select,
        .filter-bar input {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            transition: var(--transition);
            animation: slideIn 0.3s ease-out backwards;
        }

        .transaction-item:hover {
            background: var(--bg);
            transform: translateX(4px);
        }

        .transaction-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .transaction-icon.income {
            background: var(--income-light);
        }

        .transaction-icon.expense {
            background: var(--expense-light);
        }

        .transaction-icon.transfer {
            background: var(--transfer-light);
        }

        .transaction-info {
            flex: 1;
            min-width: 0;
        }

        .transaction-category {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .transaction-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .transaction-amount {
            font-size: 18px;
            font-weight: 700;
            margin-right: 16px;
        }

        .transaction-amount.income {
            color: var(--income);
        }

        .transaction-amount.expense {
            color: var(--expense);
        }

        .transaction-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(45, 42, 38, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border-radius: var(--radius);
            width: 90%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95) translateY(20px);
            transition: var(--transition);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            padding: 24px 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 15px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(196, 80, 26, 0.1);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .category-option {
            padding: 12px 8px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-secondary);
        }

        .category-option:hover {
            border-color: var(--accent-light);
        }

        .category-option.selected {
            border-color: var(--accent);
            background: var(--expense-light);
        }

        .category-option .icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
        }

        .category-option .name {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .modal-footer {
            padding: 0 24px 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .tab {
            padding: 8px 16px;
            border: none;
            background: none;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .tab:hover {
            color: var(--text-primary);
            background: var(--bg-secondary);
        }

        .tab.active {
            color: var(--accent);
            background: var(--expense-light);
            font-weight: 600;
        }

        /* Loan Section */
        .loan-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 28px;
            box-shadow: 0 2px 8px var(--shadow);
            animation: fadeIn 0.5s ease-out backwards;
            animation-delay: 0.6s;
        }

        .loan-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .loan-stat {
            text-align: center;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
        }

        .loan-stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--expense);
        }

        .loan-stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }

            .header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .header h1 {
                font-size: 24px;
            }

            .accounts-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .account-card {
                padding: 16px;
            }

            .account-balance {
                font-size: 18px;
            }

            .summary-section {
                grid-template-columns: 1fr;
            }

            .summary-value {
                font-size: 24px;
            }

            .quick-actions {
                flex-direction: column;
            }

            .quick-btn {
                flex-direction: row;
                justify-content: center;
            }

            .charts-section {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 220px;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filter-bar {
                width: 100%;
            }

            .filter-bar select,
            .filter-bar input {
                flex: 1;
            }

            .transaction-item {
                flex-wrap: wrap;
            }

            .transaction-amount {
                width: 100%;
                text-align: right;
                margin: 8px 0 0;
            }

            .category-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .modal {
                width: 95%;
                max-height: 85vh;
            }
        }

        @media (max-width: 480px) {
            .accounts-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .account-card {
                padding: 12px;
            }

            .account-icon {
                font-size: 24px;
            }

            .category-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .category-option {
                padding: 10px 4px;
            }

            .category-option .icon {
                font-size: 20px;
            }
        }

        /* Print Styles */
        @media print {
            .header-actions,
            .quick-actions,
            .transaction-actions,
            .modal-overlay,
            .btn {
                display: none !important;
            }

            body {
                background: white;
            }

            .container {
                max-width: 100%;
            }

            .account-card,
            .summary-card,
            .chart-card,
            .transactions-section,
            .loan-section {
                box-shadow: none;
                border: 1px solid #ddd;
                break-inside: avoid;
            }
        }

        /* Loading State */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .skeleton {
            background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--border) 50%, var(--bg-secondary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            box-shadow: 0 4px 20px var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
            min-width: 280px;
            border-left: 4px solid var(--accent);
        }

        .toast.success {
            border-left-color: var(--success);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        .toast.warning {
            border-left-color: var(--warning);
        }

        .toast-icon {
            font-size: 20px;
        }

        .toast-message {
            flex: 1;
            font-size: 14px;
        }

        .toast-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>个人记账</h1>
            <div class="header-actions">
                <div class="sync-status" id="syncStatus">正在连接...</div>

                <button class="btn btn-secondary" onclick="window.print()">🖨️ 打印</button>
                <button class="btn btn-primary" onclick="openBudgetModal()">💰 预算设置</button>
            </div>

        <!-- Accounts Section -->
        <section class="accounts-section">

            </div>

        <!-- Summary Section -->
        <section class="summary-section">
            <div class="summary-card income">
                <div class="summary-label">本月收入</div>
                <div class="summary-value" id="monthIncome">¥0.00</div>
            </div>
            <div class="summary-card expense">
                <div class="summary-label">本月支出</div>
                <div class="summary-value" id="monthExpense">¥0.00</div>
            </div>
            <div class="summary-card balance">
                <div class="summary-label">本月结余</div>
                <div class="summary-value" id="monthBalance">¥0.00</div>
            </div>
        </section>

        <!-- Budget Progress -->
        <div class="budget-progress" id="budgetSection" style="display: none;">
            <div class="budget-header">
                <span class="budget-title">📊 月度预算</span>
                <span class="budget-stats" id="budgetStats">已用 ¥0 / ¥0</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="budgetProgress" style="width: 0%"></div>
            </div>
        </div>

        <!-- Quick Actions -->
        <section class="quick-actions">
            <button class="quick-btn income" onclick="openTransactionModal('income')">
                <span class="icon">💰</span>
                <span class="label">记收入</span>
            </button>
            <button class="quick-btn expense" onclick="openTransactionModal('expense')">
                <span class="icon">💸</span>
                <span class="label">记支出</span>
            </button>
            <button class="quick-btn transfer" onclick="openTransactionModal('transfer')">
                <span class="icon">🔄</span>
                <span class="label">转账</span>
            </button>
        </section>

        <!-- Charts Section -->
        <section class="charts-section">
            <div class="chart-card">
                <h3 class="chart-title">📊 支出分类占比</h3>
                <div class="chart-container">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3 class="chart-title">📈 近6个月收支趋势</h3>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Loan Section -->
        <section class="loan-section" id="loanSection">
            <div class="section-header">
                <h2 class="section-title">💳 贷款管理</h2>
                <div>
                    <button class="btn btn-primary" onclick="openLoanModal()">➕ 新增借款</button>
                    <button class="btn btn-secondary" onclick="openRepaymentModal()">💵 记录还款</button>
                </div>
            </div>
            <div class="loan-stats" id="loanStats">
                <!-- Loan stats will be rendered here -->
            </div>
            <div class="transaction-list" id="loanList">
                <!-- Loan list will be rendered here -->
            </div>
        </section>

        <!-- Transactions Section -->
        <section class="transactions-section">
            <div class="section-header">
                <h2 class="section-title">📝 收支明细</h2>
                <div class="filter-bar">
                    <select id="monthFilter" onchange="filterByMonth()">
                        <!-- Month options will be populated -->
                    </select>
                    <select id="accountFilter" onchange="filterByAccount()">
                        <option value="">所有账户</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="搜索备注..." oninput="searchTransactions()">
                </div>
            </div>
            <div class="transaction-list" id="transactionList">
                <!-- Transactions will be rendered here -->
            </div>
        </section>
    </div>

    <!-- Transaction Modal -->
    <div class="modal-overlay" id="transactionModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="transactionModalTitle">记一笔</h3>
                <button class="modal-close" onclick="closeModal('transactionModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="tabs" id="transactionTabs">
                    <button class="tab active" data-type="expense" onclick="switchTransactionType('expense')">支出</button>
                    <button class="tab" data-type="income" onclick="switchTransactionType('income')">收入</button>
                    <button class="tab" data-type="transfer" onclick="switchTransactionType('transfer')">转账</button>
                </div>
                
                <div class="form-group">
                    <label class="form-label">选择分类</label>
                    <div class="category-grid" id="categoryGrid">
                        <!-- Categories will be rendered here -->
                    </div>
                </div>

                <div class="form-group" id="fromAccountGroup">
                    <label class="form-label" id="fromAccountLabel">支出账户</label>
                    <select class="form-select" id="fromAccount">
                        <!-- Accounts will be populated -->
                    </select>
                </div>

                <div class="form-group" id="toAccountGroup" style="display: none;">
                    <label class="form-label">转入账户</label>
                    <select class="form-select" id="toAccount">

                    </select>

                    <label class="form-label">金额</label>

                <div class="form-group">
                    <label class="form-label">日期</label>
                    <input type="date" class="form-input" id="transactionDate">
                </div>

                    <label class="form-label">备注（可选）</label>

                <button class="btn btn-primary" onclick="saveTransaction()">保存</button>

    <!-- Budget Modal -->
    <div class="modal-overlay" id="budgetModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">💰 预算设置</h3>
                <button class="modal-close" onclick="closeModal('budgetModal')">&times;</button>
            </div>

                    <label class="form-label">月度总预算</label>
                    <input type="number" class="form-input" id="totalBudget" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label class="form-label">预算周期</label>
                    <select class="form-select" id="budgetPeriod">
                        <option value="monthly">每月</option>
                        <option value="weekly">每周</option>
                        <option value="yearly">每年</option>
