<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人记账 - Personal Bookkeeping</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd.min.js"></script>
    
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        /* ============================================
           CSS Variables - Design System
           ============================================ */
        :root {
            /* Colors */
            --bg-primary: #0f0f10;
            --bg-card: #18181b;
            --bg-hover: #27272a;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #27272a;
            --border-light: #3f3f46;
            
            /* Border Radius */
            --radius-card: 12px;
            --radius-button: 8px;
            --radius-tag: 6px;
            
            /* Shadows */
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
            --shadow-card-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.3);
            
            /* Transitions */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s ease;
        }
        
        /* ============================================
           Reset & Base Styles
           ============================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-card);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-light);
        }
        
        /* ============================================
           Typography
           ============================================ */
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        .text-gradient {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* ============================================
           Layout
           ============================================ */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .header-title {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-title .icon {
            font-size: 28px;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        /* Grid Layouts */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        
        @media (max-width: 768px) {
            .grid-3, .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        
        /* Section */
        .section {
            margin-bottom: 32px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* ============================================
           Cards
           ============================================ */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            padding: 20px;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-card);
        }
        
        .card:hover {
            border-color: var(--border-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-card-hover);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .card-label {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .card-value {
            font-size: 28px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .card-value.income {
            color: var(--success);
        }
        
        .card-value.expense {
            color: var(--danger);
        }
        
        .card-value.balance {
            color: var(--text-primary);
        }
        
        /* ============================================
           Buttons
           ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            border-radius: var(--radius-button);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--transition-fast);
            background: var(--bg-hover);
            color: var(--text-primary);
            text-decoration: none;
        }
        
        .btn:hover {
            background: var(--border-light);
            transform: translateY(-1px);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: var(--shadow-glow);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-success:hover {
            background: #16a34a;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }
        
        .btn-outline {
            background: transparent;
            border-color: var(--border);
        }
        
        .btn-outline:hover {
            border-color: var(--border-light);
            background: var(--bg-hover);
        }
        
        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: var(--radius-button);
        }
        
        .btn-large {
            padding: 16px 32px;
            font-size: 16px;
            border-radius: var(--radius-card);
        }
        
        .btn-block {
            width: 100%;
        }
        
        /* Quick Action Buttons */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        
        @media (max-width: 768px) {
            .quick-actions {
                grid-template-columns: 1fr;
            }
        }
        
        .quick-action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 32px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            cursor: pointer;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-card);
        }
        
        .quick-action-btn:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-card-hover), var(--shadow-glow);
        }
        
        .quick-action-btn:active {
            transform: scale(0.98);
        }
        
        .quick-action-btn .icon {
            font-size: 40px;
            transition: transform var(--transition-normal);
        }
        
        .quick-action-btn:hover .icon {
            transform: scale(1.1);
        }
        
        .quick-action-btn .label {
            font-size: 16px;
            font-weight: 600;
        }
        
        /* ============================================
           Account Cards
           ============================================ */
        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }
        
        .account-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 16px;
            cursor: pointer;
            transition: all var(--transition-normal);
            position: relative;
            overflow: hidden;
        }
        
        .account-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            transform: scaleX(0);
            transition: transform var(--transition-normal);
        }
        
        .account-card:hover {
            border-color: var(--border-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-card-hover);
        }
        
        .account-card:hover::before {
            transform: scaleX(1);
        }
        
        .account-card.selected {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }
        
        .account-card.selected::before {
            transform: scaleX(1);
        }
        
        .account-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .account-name {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        
        .account-balance {
            font-size: 20px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* ============================================
           Charts
           ============================================ */
        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 20px;
            height: 320px;
            position: relative;
        }
        
        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
        
        .chart-wrapper {
            position: relative;
            height: calc(100% - 40px);
        }
        
        /* ============================================
           Transaction List
           ============================================ */
        .transaction-list {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            overflow: hidden;
        }
        
        .transaction-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            transition: background var(--transition-fast);
        }
        
        .transaction-item:last-child {
            border-bottom: none;
        }
        
        .transaction-item:hover {
            background: var(--bg-hover);
        }
        
        .transaction-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-tag);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 16px;
            flex-shrink: 0;
        }
        
        .transaction-info {
            flex: 1;
            min-width: 0;
        }
        
        .transaction-title {
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .transaction-meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
        }
        
        .transaction-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 600;
            margin-right: 16px;
        }
        
        .transaction-amount.income {
            color: var(--success);
        }
        
        .transaction-amount.expense {
            color: var(--danger);
        }
        
        .transaction-actions {
            display: flex;
            gap: 8px;
        }
        
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        /* ============================================
           Modal
           ============================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-normal);
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow: hidden;
            transform: scale(0.95) translateY(20px);
            transition: transform var(--transition-normal);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-tag);
            border: none;
            background: var(--bg-hover);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }
        
        .modal-close:hover {
            background: var(--danger);
            color: white;
        }
        
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            max-height: calc(90vh - 140px);
        }
        
        .modal-footer {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            justify-content: flex-end;
        }
        
        /* ============================================
           Form Elements
           ============================================ */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        
        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-button);
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }
        
        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .form-input::placeholder,
        .form-textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }
        
        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        /* Category Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 4px;
        }
        
        @media (max-width: 480px) {
            .category-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-button);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .category-item:hover {
            border-color: var(--border-light);
            background: var(--bg-hover);
        }
        
        .category-item.selected {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }
        
        .category-item .icon {
            font-size: 24px;
        }
        
        .category-item .name {
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        
        /* ============================================
           Budget
           ============================================ */
        .budget-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 20px;
        }
        
        .budget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .budget-info {
            display: flex;
            gap: 24px;
        }
        
        .budget-item {
            text-align: center;
        }
        
        .budget-item-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        
        .budget-item-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 600;
        }
        
        .progress-bar {
            height: 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            border-radius: 4px;
            transition: width var(--transition-slow);
        }
        
        .progress-fill.warning {
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
        }
        
        .progress-fill.danger {
            background: linear-gradient(90deg, var(--danger), #f87171);
        }
        
        .budget-percentage {
            text-align: right;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        /* ============================================
           Loan Management
           ============================================ */
        .loan-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .loan-tab {
            padding: 8px 16px;
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius-tag);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 14px;
        }
        
        .loan-tab:hover {
            background: var(--border-light);
        }
        
        .loan-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        
        .loan-list {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            overflow: hidden;
        }
        
        .loan-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .loan-item:last-child {
            border-bottom: none;
        }
        
        .loan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .loan-title {
            font-weight: 600;
        }
        
        .loan-amount {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }
        
        .loan-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        
        .loan-progress {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .loan-progress-bar {
            flex: 1;
            height: 6px;
            background: var(--bg-primary);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .loan-progress-fill {
            height: 100%;
            background: var(--success);
            border-radius: 3px;
            transition: width var(--transition-slow);
        }
        
        .loan-progress-text {
            font-size: 12px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* ============================================
           Month Selector
           ============================================ */
        .month-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-button);
            padding: 8px 16px;
        }
        
        .month-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: var(--bg-hover);
            color: var(--text-secondary);
            border-radius: var(--radius-tag);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }
        
        .month-btn:hover {
            background: var(--accent);
            color: white;
        }
        
        .month-display {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            min-width: 100px;
            text-align: center;
        }
        
        /* ============================================
           Tags
           ============================================ */
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 500;
            border-radius: var(--radius-tag);
            background: var(--bg-hover);
            color: var(--text-secondary);
        }
        
        .tag-primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--accent-hover);
        }
        
        .tag-success {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }
        
        .tag-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }
        
        /* ============================================
           Animations
           ============================================ */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        @keyframes countUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        .animate-slide-in {
            animation: slideIn 0.3s ease forwards;
        }
        
        .animate-pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        
        /* Staggered animations */
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.1s; }
        .stagger-3 { animation-delay: 0.15s; }
        .stagger-4 { animation-delay: 0.2s; }
        .stagger-5 { animation-delay: 0.25s; }
        
        /* ============================================
           Loading States
           ============================================ */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .skeleton {
            background: linear-gradient(90deg, var(--bg-hover) 25%, var(--border) 50%, var(--bg-hover) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-tag);
        }
        
        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
        
        /* ============================================
           Toast Notifications
           ============================================ */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-button);
            padding: 16px 20px;
            box-shadow: var(--shadow-card-hover);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            animation: slideInRight 0.3s ease;
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .toast.success {
            border-color: var(--success);
        }
        
        .toast.error {
            border-color: var(--danger);
        }
        
        .toast-icon {
            font-size: 20px;
        }
        
        .toast-content {
            flex: 1;
        }
        
        .toast-title {
            font-weight: 600;
            margin-bottom: 2px;
        }
        
        .toast-message {

        }
        
        /* ============================================

        }

        }

        function updateMonthlyOverview() {
            var monthTransactions = transactions.filter(function(t) {

            });
            
            var income = monthTransactions
                .filter(function(t) { return t.type === 'income'; })
                .reduce(function(sum, t) { return sum + (parseFloat(t.amount) || 0); }, 0);
            
            var expense = monthTransactions
                .filter(function(t) { return t.type === 'expense'; })
                .reduce(function(sum, t) { return sum + (parseFloat(t.amount) || 0); }, 0);
            
            var balance = income - expense;
            
            animateNumber('monthIncome', income);
            animateNumber('monthExpense', expense);
            animateNumber('monthBalance', balance);
        }
        
        function animateNumber(elementId, value) {
            var element = document.getElementById(elementId);
            var start = parseFloat(element.textContent.replace(/[^\d.-]/g, '')) || 0;
            var end = value;
            var duration = 500;
            var startTime = null;
            
            function animate(currentTime) {
                if (!startTime) startTime = currentTime;
                var elapsed = currentTime - startTime;
                var progress = Math.min(elapsed / duration, 1);
                var easeProgress = 1 - Math.pow(1 - progress, 3);
                var current = start + (end - start) * easeProgress;
                
                element.textContent = formatCurrency(current);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            
            requestAnimationFrame(animate);
        }

        async function saveTransaction() {
            var type = document.getElementById('transactionType').value;
            var amount = parseFloat(document.getElementById('transactionAmount').value);
            var categoryId = document.getElementById('selectedCategory').value;
            var fromAccountId = document.getElementById('fromAccount').value;
            var toAccountId = document.getElementById('toAccount').value;
            var date = document.getElementById('transactionDate').value;
            var description = document.getElementById('transactionDescription').value;
            
            if (!amount || amount <= 0) {
                showToast('请输入有效金额', 'error');
                return;
            }
            
            if (!categoryId && type !== 'transfer') {
                showToast('请选择分类', 'error');
                return;
            }
            
            if (!fromAccountId) {
                showToast('请选择账户', 'error');
                return;
            }
            
            if (type === 'transfer' && !toAccountId) {
                showToast('请选择转入账户', 'error');
                return;
            }
            
            try {
                var transaction = {
                    type: type,
                    amount: amount,
                    category_id: categoryId || null,
                    from_account_id: fromAccountId,
                    to_account_id: type === 'transfer' ? toAccountId : null,
                    date: date,
                    description: description,
                    created_at: new Date().toISOString()
                };
                
                if (_sb) {
                    var { error } = await _sb.from('transactions').insert(transaction);
                    if (error) throw error;
                }
                
                // Update account balances
                await updateAccountBalance(fromAccountId, type === 'income' ? amount : -amount);
                if (type === 'transfer') {
                    await updateAccountBalance(toAccountId, amount);
                    await updateAccountBalance(fromAccountId, -amount);
                }
                
                transactions.unshift(transaction);
                
                closeModal('transactionModal');
                document.getElementById('transactionForm').reset();
                initDateInputs();
                
                updateDashboard();
                showToast('记账成功', 'success');
            } catch (error) {
                console.error('Save transaction error:', error);
                showToast('记账失败', 'error');
            }
        }
        
        async function updateAccountBalance(accountId, delta) {
            try {
                if (!_sb) return;
                
                var account = accounts.find(function(a) { return a.id === accountId; });
                if (!account) return;
                
                var newBalance = (account.balance || 0) + delta;
                
                var { error } = await _sb.from('accounts')
                    .update({ balance: newBalance })
                    .eq('id', accountId);
                
                if (error) throw error;
                
                account.balance = newBalance;
            } catch (error) {
                console.error('Update balance error:', error);
            }
        }

        async function saveBudget() {
            var amount = parseFloat(document.getElementById('budgetInput').value);
            var month = document.getElementById('budgetMonth').value;
            
            if (!amount || amount < 0) {
                showToast('请输入有效金额', 'error');
                return;
            }
            
            try {
                var existing = budgets.find(function(b) { return b.month === month; });
                
                if (_sb) {
                    if (existing) {
                        var { error } = await _sb.from('budgets')
                            .update({ amount: amount })
                            .eq('id', existing.id);
                        if (error) throw error;
                        existing.amount = amount;
                    } else {
                        var { data, error } = await _sb.from('budgets')
                            .insert({ month: month, amount: amount })
                            .select();
                        if (error) throw error;
                        budgets.push(data[0]);
                    }
                }
                
                closeModal('budgetModal');
                document.getElementById('budgetForm').reset();
                initDateInputs();
                
                updateBudgetDisplay();
                showToast('预算设置成功', 'success');

                showToast('预算设置失败', 'error');
            }
        }
        
        function updateBudgetDisplay() {
            var budget = budgets.find(function(b) { return b.month === currentMonth; });
            var budgetAmount = budget ? budget.amount : 0;
            
            var monthExpense = transactions
                .filter(function(t) {
                    return t.type === 'expense' && t.date && t.date.startsWith(currentMonth);
                })
                .reduce(function(sum, t) { return sum + (parseFloat(t.amount) || 0); }, 0);
            
            var remaining = Math.max(0, budgetAmount - monthExpense);
            var percentage = budgetAmount > 0 ? (monthExpense / budgetAmount * 100) : 0;
            
            document.getElementById('budgetAmount').textContent = formatCurrency(budgetAmount);
            document.getElementById('budgetSpent').textContent = formatCurrency(monthExpense);
            document.getElementById('budgetRemaining').textContent = formatCurrency(remaining);
            document.getElementById('budgetPercentage').textContent = '已使用 ' + percentage.toFixed(1) + '%';
            
            var progressFill = document.getElementById('budgetProgress');
            progressFill.style.width = Math.min(percentage, 100) + '%';
            progressFill.className = 'progress-fill';
            
            if (percentage >= 100) {
                progressFill.classList.add('danger');
            } else if (percentage >= 80) {
                progressFill.classList.add('warning');
            }
        }

        function updateExpensePieChart() {
            var canvas = document.getElementById('expensePieChart');

            var ctx = canvas.getContext('2d');
            
            // Get expense data for current month
            var monthExpenses = transactions.filter(function(t) {

            });
            
            var categoryTotals = {};
            monthExpenses.forEach(function(t) {

                categoryTotals[catId] = (categoryTotals[catId] || 0) + (parseFloat(t.amount) || 0);
            });
            
            var labels = [];
            var data = [];
            var colors = [];
            
            Object.keys(categoryTotals).forEach(function(catId) {
                var cat = expenseCategories.find(function(c) { return c.id === catId; });
                if (cat && categoryTotals[catId] > 0) {
                    labels.push(cat.name);
                    data.push(categoryTotals[catId]);
                    colors.push(cat.color);
                }
            });
            
            if (data.length === 0) {
                labels = ['暂无数据'];
                data = [1];
                colors = ['#27272a'];
            }
            
            if (expensePieChart) {
                expensePieChart.destroy();
            }
            
            expensePieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#a1a1aa',
                                font: { size: 11 },
                                boxWidth: 12,
                                padding: 8
                            }

                    },
                    cutout: '60%'
                }
            });
        }

            if (!canvas) return;
            
            var ctx = canvas.getContext('2d');
            
            // Get last 6 months data

        function renderLoans() {
            var list = document.getElementById('loanList');
            
            var filteredLoans = loans.filter(function(l) {
                if (currentLoanTab === 'history') {
                    return l.status === 'completed';
                }
                return l.type === currentLoanTab && l.status !== 'completed';
            });
            
            if (filteredLoans.length === 0) {
                list.innerHTML = '<div class="empty-state" style="padding: 32px;"><div class="empty-state-icon">📋</div><p>暂无记录</p></div>';
                return;
            }
            
            list.innerHTML = filteredLoans.map(function(loan) {
                var loanRepayments = repayments.filter(function(r) { return r.loan_id === loan.id; });
                var totalRepaid = loanRepayments.reduce(function(sum, r) { return sum + (parseFloat(r.amount) || 0); }, 0);
                var remaining = (parseFloat(loan.amount) || 0) - totalRepaid;
                var progress = loan.amount > 0 ? (totalRepaid / loan.amount * 100) : 0;
                
                var interestInfo = '';
                if (loan.interest_rate > 0) {
                    var days = Math.floor((new Date() - new Date(loan.date)) / (1000 * 60 * 60 * 24));
                    var interest = loan.amount * (loan.interest_rate / 100) * (days / 365);
                    interestInfo = ' | 预估利息: ' + formatCurrency(interest);
                }
                
                return '<div class="loan-item">' +
                    '<div class="loan-header">' +
                    '<span class="loan-title">' + loan.person + '</span>' +
                    '<span class="loan-amount">' + formatCurrency(loan.amount) + '</span>' +
                    '</div>' +
                    '<div class="loan-meta">' +
                    '<span>借款日期: ' + formatDate(loan.date) + '</span>' +
                    (loan.due_date ? '<span>还款期限: ' + formatDate(loan.due_date) + '</span>' : '') +
                    (loan.interest_rate > 0 ? '<span>利率: ' + loan.interest_rate + '%</span>' : '') +
                    interestInfo +
                    '</div>' +
                    '<div class="loan-progress">' +
                    '<div class="loan-progress-bar">' +
                    '<div class="loan-progress-fill" style="width: ' + progress + '%"></div>' +
                    '</div>' +
                    '<span class="loan-progress-text">' + progress.toFixed(0) + '%</span>' +
                    '</div>' +
                    '<div style="margin-top: 12px; display: flex; gap: 8px;">' +
                    '<button class="btn btn-primary" onclick="openRepaymentModal(\'' + loan.id + '\')">还款</button>' +
                    '<button class="btn btn-outline" onclick="viewRepayments(\'' + loan.id + '\')">查看记录</button>' +
                    '</div>' +
                    '</div>';
            }).join('');
        }
        
        function openLoanModal() {
            document.getElementById('loanModal').classList.add('active');
        }
        
        function updateLoanType() {
            var type = document.getElementById('loanTypeSelect').value;
            document.getElementById('loanType').value = type;
            document.getElementById('loanModalTitle').textContent = type === 'borrowed' ? '新增借款' : '新增借出';
        }
        
        async function saveLoan() {
            var type = document.getElementById('loanType').value;
            var person = document.getElementById('loanPerson').value;
            var amount = parseFloat(document.getElementById('loanAmount').value);
            var interestRate = parseFloat(document.getElementById('loanInterestRate').value) || 0;
            var date = document.getElementById('loanDate').value;
            var dueDate = document.getElementById('loanDueDate').value;
            var accountId = document.getElementById('loanAccount').value;
            var description = document.getElementById('loanDescription').value;
            
            if (!person || !amount || !date || !accountId) {
                showToast('请填写完整信息', 'error');
                return;
            }
            
            try {
                var loan = {
                    type: type,
                    person: person,
                    amount: amount,
                    interest_rate: interestRate,
                    date: date,
                    due_date: dueDate || null,
                    account_id: accountId,
                    description: description,
                    status: 'active',
                    created_at: new Date().toISOString()
                };
                
                if (_sb) {
                    var { data, error } = await _sb.from('loans').insert(loan).select();
                    if (error) throw error;
                    loans.unshift(data[0]);
                } else {
                    loan.id = Date.now().toString();
                    loans.unshift(loan);
                }
                
                // Update account balance
                await updateAccountBalance(accountId, type === 'borrowed' ? amount : -amount);
                
                closeModal('loanModal');
                document.getElementById('loanForm').reset();
                initDateInputs();
                
                renderLoans();
                renderAccounts();
                showToast('借款记录已保存', 'success');
            } catch (error) {
                console.error('Save loan error:', error);
                showToast('保存失败', 'error');
            }
        }
        
        function openRepaymentModal(loanId) {
            document.getElementById('repaymentLoanId').value = loanId;
            document.getElementById('repaymentModal').classList.add('active');
        }
        
        async function saveRepayment() {
            var loanId = document.getElementById('repaymentLoanId').value;
            var amount = parseFloat(document.getElementById('repaymentAmount').value);
            var date = document.getElementById('repaymentDate').value;
            var accountId = document.getElementById('repaymentAccount').value;
            var description = document.getElementById('repaymentDescription').value;
            
            if (!amount || !date || !accountId) {
                showToast('请填写完整信息', 'error');
                return;
            }
            
            try {
                var repayment = {
                    loan_id: loanId,
                    amount: amount,
                    date: date,
                    account_id: accountId,
                    description: description,
                    created_at: new Date().toISOString()
                };
                
                if (_sb) {
                    var { data, error } = await _sb.from('repayments').insert(repayment).select();
                    if (error) throw error;
                    repayments.push(data[0]);
                } else {
                    repayment.id = Date.now().toString();
                    repayments.push(repayment);
                }
                
                // Update account balance
                var loan = loans.find(function(l) { return l.id === loanId; });
                if (loan) {
                    await updateAccountBalance(accountId, loan.type === 'borrowed' ? -amount : amount);
                }
                
                // Check if loan is fully repaid
                var loanRepayments = repayments.filter(function(r) { return r.loan_id === loanId; });
                var totalRepaid = loanRepayments.reduce(function(sum, r) { return sum + (parseFloat(r.amount) || 0); }, 0);
                
                if (loan && totalRepaid >= loan.amount && _sb) {
                    await _sb.from('loans').update({ status: 'completed' }).eq('id', loanId);
                    loan.status = 'completed';
                }
                
                closeModal('repaymentModal');
                document.getElementById('repaymentForm').reset();
                initDateInputs();
                
                renderLoans();
                renderAccounts();
                showToast('还款记录已保存', 'success');
            } catch (error) {
                console.error('Save repayment error:', error);
                showToast('保存失败', 'error');
            }
        }
        
        function viewRepayments(loanId) {
            var loanRepayments = repayments.filter(function(r) { return r.loan_id === loanId; });
            var loan = loans.find(function(l) { return l.id === loanId; });
            
            if (loanRepayments.length === 0) {
                showToast('暂无还款记录', 'success');
                return;
            }
            
            var totalRepaid = loanRepayments.reduce(function(sum, r) { return sum + (parseFloat(r.amount) || 0); }, 0);
            var message = '借款: ' + formatCurrency(loan.amount) + '\n已还: ' + formatCurrency(totalRepaid) + '\n\n还款记录:\n' +
                loanRepayments.map(function(r) {
                    return formatDate(r.date) + ' - ' + formatCurrency(r.amount);
                }).join('\n');
            
            alert(message);
        }
        
        // ============================================
        // Month Navigation
        // ============================================
        function changeMonth(delta) {
            var parts = currentMonth.split('-');
            var year = parseInt(parts[0]);
            var month = parseInt(parts[1]);
            
            month += delta;
            if (month > 12) {
                month = 1;
                year++;
            } else if (month < 1) {
                month = 12;
                year--;
            }
            
            currentMonth = year + '-' + String(month).padStart(2, '0');
            updateMonthDisplay();
            updateDashboard();
        }
        
        function updateMonthDisplay() {
            document.getElementById('currentMonthDisplay').textContent = currentMonth;
        }
        
        // ============================================
        // Export
        // ============================================
        function exportToExcel() {
            try {
                var wb = XLSX.utils.book_new();
                
                // Transactions sheet
                var transData = transactions.map(function(t) {
                    var cat = categories.find(function(c) { return c.id === t.category_id; });
                    var account = accounts.find(function(a) { return a.id === t.from_account_id; });
                    return {
                        '日期': t.date,
                        '类型': t.type === 'income' ? '收入' : t.type === 'expense' ? '支出' : '转账',
                        '分类': cat ? cat.name : '',
                        '账户': account ? account.name : '',
                        '金额': t.amount,
                        '备注': t.description || ''
                    };
                });
                
                var transWs = XLSX.utils.json_to_sheet(transData);
                XLSX.utils.book_append_sheet(wb, transWs, '交易记录');
                
                // Accounts sheet
                var accData = accounts.map(function(a) {
                    return {
                        '账户': a.name,
                        '余额': a.balance || 0
                    };
                });
                
                var accWs = XLSX.utils.json_to_sheet(accData);
                XLSX.utils.book_append_sheet(wb, accWs, '账户');
                
                // Loans sheet
                var loanData = loans.map(function(l) {
                    return {
                        '类型': l.type === 'borrowed' ? '借入' : '借出',
                        '对方': l.person,
                        '金额': l.amount,
                        '利率': l.interest_rate + '%',
                        '日期': l.date,
                        '状态': l.status === 'completed' ? '已还清' : '进行中'
                    };
                });
                
                var loanWs = XLSX.utils.json_to_sheet(loanData);
                XLSX.utils.book_append_sheet(wb, loanWs, '贷款');
                
                XLSX.writeFile(wb, '个人记账数据_' + currentMonth + '.xlsx');
                showToast('导出成功', 'success');
            } catch (error) {
                console.error('Export error:', error);
                showToast('导出失败', 'error');
            }
        }
        
        // ============================================
        // Modal Management
        // ============================================
        function openSettingsModal() {
            document.getElementById('settingsModal').classList.add('active');
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        
        // Close modal on overlay click
        document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                }
            });
        });
        
        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active').forEach(function(modal) {
                    modal.classList.remove('active');
                });
            }
        });
        
        // ============================================
        // Toast Notifications
        // ============================================
        function showToast(message, type) {
            var container = document.getElementById('toastContainer');
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            
            var icon = type === 'success' ? '✓' : '✕';
            var title = type === 'success' ? '成功' : '错误';
            
            toast.innerHTML = '<span class="toast-icon">' + icon + '</span>' +
                '<div class="toast-content">' +
                '<div class="toast-title">' + title + '</div>' +
                '<div class="toast-message">' + message + '</div>' +
                '</div>';
            
            container.appendChild(toast);
            
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(function() {
                    toast.remove();
                }, 300);
            }, 3000);
        }
        
        // ============================================
        // Utility Functions
        // ============================================
        function formatCurrency(amount) {
            var num = parseFloat(amount) || 0;
            return '¥' + num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return '';
            var d = new Date(dateStr);
            return d.toLocaleDateString('zh-CN');
        }
    </script>
</body>
</html>
