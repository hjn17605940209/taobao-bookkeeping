<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人记账 - Personal Bookkeeping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ========== CSS RESET & VARIABLES ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#0a0a0f;--bg-secondary:#0f0f1a;--bg-card:rgba(255,255,255,0.03);
  --border-color:rgba(255,255,255,0.06);--border-hover:rgba(139,92,246,0.4);
  --text-primary:#f0f0f5;--text-secondary:#8888a0;--text-muted:#55556a;
  --accent-indigo:#6366f1;--accent-purple:#8b5cf6;--accent-pink:#ec4899;
  --green:#22c55e;--green-glow:rgba(34,197,94,0.3);--red:#ef4444;--red-glow:rgba(239,68,68,0.3);
  --blue:#3b82f6;--yellow:#eab308;--orange:#f97316;--cyan:#06b6d4;
  --font-mono:'JetBrains Mono',monospace;--font-sans:'Inter',system-ui,sans-serif;
  --radius:16px;--radius-sm:10px;--radius-xs:6px;
  --glass-bg:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.08);
  --shadow-glow:0 0 40px rgba(99,102,241,0.15);
  --transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-sans);background:var(--bg-primary);color:var(--text-primary);
  min-height:100vh;overflow-x:hidden;line-height:1.6;
}

/* ========== BACKGROUND EFFECTS ========== */
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,black 20%,transparent 70%);
}
.bg-glow{
  position:fixed;top:-200px;left:50%;transform:translateX(-50%);
  width:800px;height:600px;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse,rgba(99,102,241,0.15) 0%,rgba(139,92,246,0.08) 40%,transparent 70%);
  filter:blur(40px);transition:transform 0.8s cubic-bezier(0.25,0.46,0.45,0.94);
}
.bg-glow-secondary{
  position:fixed;bottom:-300px;right:-200px;z-index:0;pointer-events:none;
  width:600px;height:600px;
  background:radial-gradient(ellipse,rgba(236,72,153,0.08) 0%,transparent 60%);
  filter:blur(60px);
}

/* ========== NAVBAR ========== */
.navbar{
  position:sticky;top:0;z-index:100;padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;
  transition:var(--transition);
}
.navbar.scrolled{
  background:rgba(10,10,15,0.8);backdrop-filter:blur(20px) saturate(1.5);
  border-bottom:1px solid var(--glass-border);
}
.nav-brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700}
.nav-brand-icon{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent-indigo),var(--accent-purple));
  font-size:20px;box-shadow:0 4px 20px rgba(99,102,241,0.3);
}
.sync-status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)}
.sync-dot{
  width:8px;height:8px;border-radius:50%;background:var(--text-muted);
  transition:var(--transition);
}
.sync-dot.connecting{background:var(--yellow);animation:pulse 1.5s infinite}
.sync-dot.synced{background:var(--green);animation:bounceIn 0.5s ease}
.sync-dot.error{background:var(--red);animation:shake 0.5s ease}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}}
@keyframes bounceIn{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ========== MAIN CONTAINER ========== */
.container{
  position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 24px 80px;
}

/* ========== MONTH SELECTOR ========== */
.month-selector{
  display:flex;align-items:center;justify-content:center;gap:20px;
  padding:20px 0 32px;
}
.month-selector button{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--glass-border);
  background:var(--glass-bg);color:var(--text-secondary);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  transition:var(--transition);
}
.month-selector button:hover{
  background:rgba(99,102,241,0.15);border-color:var(--accent-indigo);color:var(--text-primary);
  box-shadow:0 0 20px rgba(99,102,241,0.2);
}
.month-label{font-size:22px;font-weight:700;min-width:160px;text-align:center}

/* ========== GLASS CARD ========== */
.glass-card{
  background:var(--glass-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);border-radius:var(--radius);
  padding:24px;position:relative;overflow:hidden;
  transition:var(--transition);
  opacity:0;transform:translateY(30px);
}
.glass-card.visible{opacity:1;transform:translateY(0)}
.glass-card::before{
  content:'';position:absolute;inset:-1px;border-radius:var(--radius);padding:1px;
  background:linear-gradient(135deg,transparent 40%,rgba(99,102,241,0.1) 50%,transparent 60%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  transition:var(--transition);opacity:0;
}
.glass-card:hover::before{
  background:linear-gradient(135deg,transparent 20%,rgba(139,92,246,0.3) 50%,transparent 80%);
  opacity:1;
}
.glass-card:hover{
  border-color:var(--border-hover);
  box-shadow:0 0 30px rgba(139,92,246,0.1),0 8px 32px rgba(0,0,0,0.3);
  transform:translateY(-2px);
}
.glass-card.visible:hover{transform:translateY(-2px)}

/* ========== STAT CARDS GRID ========== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:24px}
.stat-card{padding:20px 24px}
.stat-card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stat-icon{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.stat-icon.income{background:rgba(34,197,94,0.12);color:var(--green)}
.stat-icon.expense{background:rgba(239,68,68,0.12);color:var(--red)}
.stat-icon.balance{background:rgba(99,102,241,0.12);color:var(--accent-indigo)}
.stat-icon.budget{background:rgba(234,179,8,0.12);color:var(--yellow)}
.stat-label{font-size:13px;color:var(--text-secondary);font-weight:500}
.stat-amount{
  font-family:var(--font-mono);font-size:28px;font-weight:700;margin-bottom:8px;
  transition:var(--transition);
}
.stat-amount.income{color:var(--green);text-shadow:0 0 20px var(--green-glow)}
.stat-amount.expense{color:var(--red);text-shadow:0 0 20px var(--red-glow)}
.stat-amount.balance{color:var(--accent-indigo);text-shadow:0 0 20px rgba(99,102,241,0.3)}
.stat-change{font-size:12px;display:flex;align-items:center;gap:4px}
.stat-change.up{color:var(--green)}
.stat-change.down{color:var(--red)}

/* ========== ACTION BUTTONS ========== */
.action-buttons{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.btn{
  padding:12px 28px;border-radius:var(--radius-sm);border:none;cursor:pointer;
  font-family:var(--font-sans);font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;gap:8px;
  transition:var(--transition);position:relative;overflow:hidden;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent-indigo),var(--accent-purple));
  color:white;
  background-size:200% 200%;background-position:0% 50%;
  box-shadow:0 4px 20px rgba(99,102,241,0.3);
}
.btn-primary:hover{
  background-position:100% 50%;
  box-shadow:0 6px 30px rgba(99,102,241,0.5),0 0 60px rgba(139,92,246,0.2);
  transform:translateY(-1px);
}
.btn-primary:active{transform:scale(0.97);box-shadow:0 2px 10px rgba(99,102,241,0.3)}
.btn-expense{
  background:linear-gradient(135deg,var(--red),#f97316);
  color:white;background-size:200% 200%;background-position:0% 50%;
  box-shadow:0 4px 20px rgba(239,68,68,0.3);
}
.btn-expense:hover{
  background-position:100% 50%;
  box-shadow:0 6px 30px rgba(239,68,68,0.5),0 0 60px rgba(249,115,22,0.2);
  transform:translateY(-1px);
}
.btn-expense:active{transform:scale(0.97)}
.btn-transfer{
  background:var(--glass-bg);color:var(--text-secondary);
  border:1px solid var(--glass-border);
}
.btn-transfer:hover{
  background:rgba(99,102,241,0.1);border-color:var(--accent-indigo);color:var(--text-primary);
  box-shadow:0 0 20px rgba(99,102,241,0.15);
}
.btn-sm{padding:8px 16px;font-size:12px;border-radius:var(--radius-xs)}
.btn-ghost{
  background:transparent;color:var(--text-secondary);border:1px solid var(--glass-border);
}
.btn-ghost:hover{background:var(--glass-bg);color:var(--text-primary);border-color:var(--border-hover)}

/* ========== SECTION TITLE ========== */
.section-title{
  font-size:18px;font-weight:700;margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
}
.section-title::before{
  content:'';width:3px;height:20px;border-radius:2px;
  background:linear-gradient(180deg,var(--accent-indigo),var(--accent-purple));
}

/* ========== ACCOUNTS ========== */
.accounts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.account-card{
  padding:16px;text-align:center;cursor:pointer;
}
.account-card.active{border-color:var(--accent-indigo);background:rgba(99,102,241,0.08)}
.account-icon{font-size:28px;margin-bottom:8px}
.account-name{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.account-balance{font-family:var(--font-mono);font-size:16px;font-weight:600}

/* ========== CHARTS ========== */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:768px){.charts-grid{grid-template-columns:1fr}}
.chart-container{position:relative;height:280px}
.doughnut-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.doughnut-center-label{font-size:12px;color:var(--text-secondary)}
.doughnut-center-amount{font-family:var(--font-mono);font-size:20px;font-weight:700}

/* ========== TRANSACTION LIST ========== */
.transaction-list{margin-bottom:24px}
.transaction-item{
  display:flex;align-items:center;gap:14px;padding:14px 18px;
  border-radius:var(--radius-sm);transition:var(--transition);
  position:relative;overflow:hidden;
  animation:slideInLeft 0.4s ease forwards;
}
.transaction-item::before{
  content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;
}
.transaction-item:hover{background:rgba(255,255,255,0.03)}
.transaction-item.removing{animation:slideOutRight 0.4s ease forwards}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOutRight{to{opacity:0;transform:translateX(100px)}}
.tx-icon{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.tx-info{flex:1;min-width:0}
.tx-category{font-size:14px;font-weight:600;margin-bottom:2px}
.tx-meta{font-size:12px;color:var(--text-muted);display:flex;gap:8px}
.tx-amount{font-family:var(--font-mono);font-size:15px;font-weight:600;text-align:right;flex-shrink:0}
.tx-amount.income{color:var(--green)}
.tx-amount.expense{color:var(--red)}
.tx-delete{
  width:32px;height:32px;border-radius:8px;border:none;background:transparent;
  color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);opacity:0;flex-shrink:0;
}
.transaction-item:hover .tx-delete{opacity:1}
.tx-delete:hover{background:rgba(239,68,68,0.15);color:var(--red)}

/* ========== BUDGET PROGRESS ========== */
.budget-item{margin-bottom:16px}
.budget-header{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
.budget-name{color:var(--text-secondary)}
.budget-value{font-family:var(--font-mono);font-weight:600}
.progress-bar{
  height:8px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:4px;transition:width 1s cubic-bezier(0.4,0,0.2,1);
  position:relative;
}
.progress-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
  animation:shimmer 2s infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ========== LOAN MANAGEMENT ========== */
.loan-card{padding:16px;margin-bottom:12px}
.loan-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.loan-title{font-weight:600;font-size:15px}
.loan-amount{font-family:var(--font-mono);font-weight:700;color:var(--accent-purple)}
.loan-details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.loan-detail{text-align:center}
.loan-detail-label{font-size:11px;color:var(--text-muted);margin-bottom:2px}
.loan-detail-value{font-family:var(--font-mono);font-size:14px;font-weight:600}

/* ========== MODAL ========== */
.modal-overlay{
  position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);
  opacity:0;transition:opacity 0.3s ease;
}
.modal-overlay.active{display:flex;opacity:1}
.modal{
  background:linear-gradient(180deg,#1a1a2e,#12121f);
  border:1px solid var(--glass-border);border-radius:20px;
  padding:32px;width:90%;max-width:480px;max-height:85vh;overflow-y:auto;
  transform:translateY(40px) scale(0.95);opacity:0;
  transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:0 25px 60px rgba(0,0,0,0.5),0 0 40px rgba(99,102,241,0.1);
}
.modal-overlay.active .modal{transform:translateY(0) scale(1);opacity:1}
.modal-title{font-size:20px;font-weight:700;margin-bottom:24px;text-align:center}
.modal-close{
  position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:10px;
  border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--text-secondary);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;
  transition:var(--transition);
}
.modal-close:hover{background:rgba(239,68,68,0.15);color:var(--red);border-color:rgba(239,68,68,0.3)}

/* ========== FORM ========== */
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px;font-weight:500}
.form-input,.form-select{
  width:100%;padding:12px 16px;border-radius:var(--radius-sm);
  border:1px solid var(--glass-border);background:rgba(255,255,255,0.04);
  color:var(--text-primary);font-family:var(--font-sans);font-size:14px;
  transition:var(--transition);outline:none;
}
.form-input:focus,.form-select:focus{
  border-color:var(--accent-indigo);
  box-shadow:0 0 0 3px rgba(99,102,241,0.15),0 0 20px rgba(99,102,241,0.1);
}
.form-input::placeholder{color:var(--text-muted)}
.form-select option{background:#1a1a2e;color:var(--text-primary)}
.amount-input{
  font-family:var(--font-mono);font-size:24px;font-weight:700;text-align:center;
  padding:16px;border-radius:var(--radius);
}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.category-item{
  padding:10px 4px;border-radius:var(--radius-xs);border:1px solid var(--glass-border);
  background:var(--glass-bg);cursor:pointer;text-align:center;
  transition:var(--transition);font-size:12px;
}
.category-item:hover{border-color:var(--accent-indigo);background:rgba(99,102,241,0.08)}
.category-item.selected{border-color:var(--accent-indigo);background:rgba(99,102,241,0.15);box-shadow:0 0 15px rgba(99,102,241,0.2)}
.category-item-icon{font-size:20px;margin-bottom:4px;display:block}
.category-item-name{color:var(--text-secondary);font-size:11px}
.category-item.selected .category-item-name{color:var(--text-primary)}

/* ========== SKELETON LOADING ========== */
.skeleton{position:relative;overflow:hidden;background:rgba(255,255,255,0.04);border-radius:var(--radius-xs)}
.skeleton::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);
  animation:shimmer 1.5s infinite;
}
.skeleton-text{height:16px;margin-bottom:8px;border-radius:4px}
.skeleton-amount{height:32px;width:60%;margin-bottom:8px;border-radius:4px}
.skeleton-card{height:120px;border-radius:var(--radius);margin-bottom:16px}
.skeleton-chart{height:280px;border-radius:var(--radius)}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}

/* ========== RESPONSIVE ========== */
@media(max-width:640px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .stat-amount{font-size:22px}
  .accounts-grid{grid-template-columns:repeat(3,1fr)}
  .category-grid{grid-template-columns:repeat(3,1fr)}
  .action-buttons{flex-direction:column}
  .btn{justify-content:center}
  .loan-details{grid-template-columns:1fr}
}

/* ========== EMPTY STATE ========== */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-state-icon{font-size:48px;margin-bottom:12px;opacity:0.5}
.empty-state-text{font-size:14px}

/* ========== TOAST ========== */
.toast-container{position:fixed;top:80px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{
  padding:12px 20px;border-radius:var(--radius-sm);
  background:rgba(26,26,46,0.95);backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);font-size:13px;
  animation:toastIn 0.4s ease forwards;
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
.toast.removing{animation:toastOut 0.3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

/* ========== UTILITIES ========== */
.mb-24{margin-bottom:24px}
.text-center{text-align:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>

<!-- Background Effects -->
<div class="bg-grid"></div>
<div class="bg-glow" id="bgGlow"></div>
<div class="bg-glow-secondary"></div>

<!-- Navbar -->
<nav class="navbar" id="navbar">
  <div class="nav-brand">
    <div class="nav-brand-icon">&#128176;</div>
    <span>个人记账</span>
  </div>
  <div class="sync-status" id="syncStatus">
    <span class="sync-dot" id="syncDot"></span>
    <span id="syncText">等待连接</span>
  </div>
</nav>

<!-- Main Content -->
<div class="container">

  <!-- Month Selector -->
  <div class="month-selector">
    <button onclick="changeMonth(-1)">&#9664;</button>
    <div class="month-label" id="monthLabel">2025年1月</div>
    <button onclick="changeMonth(1)">&#9654;</button>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid" id="statsGrid">
    <div class="glass-card stat-card" style="animation-delay:0s">
      <div class="stat-card-header">
        <div class="stat-icon income">&#128200;</div>
        <span class="stat-label">本月收入</span>
      </div>
      <div class="stat-amount income" id="totalIncome">&#165;0</div>
      <div class="stat-change up" id="incomeChange">&#8593; 0% vs 上月</div>
    </div>
    <div class="glass-card stat-card" style="animation-delay:0.1s">
      <div class="stat-card-header">
        <div class="stat-icon expense">&#128201;</div>

  if(status === 'connecting') text.textContent = '连接中...';

// ========== DATA OPERATIONS ==========
async function loadData(){
  try {
    if(!_sb) return;
    var {data:txData,error:txErr} = await _sb.from('transactions').select('*').order('date',{ascending:false}).order('created_at',{ascending:false});
    if(!txErr) allTransactions = txData || [];

    var {data:bData,error:bErr} = await _sb.from('budgets').select('*');
    if(!bErr) allBudgets = bData || [];

    var {data:lData,error:lErr} = await _sb.from('loans').select('*');
    if(!lErr) allLoans = lData || [];

    var {data:rData,error:rErr} = await _sb.from('repayments').select('*');
    if(!rErr) allRepayments = rData || [];

    setSyncStatus('synced');
    renderAll();
  } catch(e){
    console.error('Load error:',e);
    setSyncStatus('error');
    renderAll();
  }
}

async function saveTransaction(tx){
  if(!_sb) return;
  try {
    var {data,error} = await _sb.from('transactions').insert([tx]).select();
    if(!error && data && data[0]){
      allTransactions.unshift(data[0]);
      setSyncStatus('synced');
      renderAll();
    } else { setSyncStatus('error'); }
  } catch(e){ setSyncStatus('error'); }
}

async function deleteTransaction(id){
  if(!_sb) return;
  try {
    await _sb.from('transactions').delete().eq('id',id);
    allTransactions = allTransactions.filter(function(t){return t.id !== id});
    setSyncStatus('synced');
    renderAll();
  } catch(e){ setSyncStatus('error'); }
}

async function saveBudget(b){
  if(!_sb) return;
  try {
    var existing = allBudgets.find(function(x){return x.category_id === b.category_id});
    if(existing){
      await _sb.from('budgets').update({amount:b.amount}).eq('id',existing.id);
      existing.amount = b.amount;
    } else {
      var {data} = await _sb.from('budgets').insert([b]).select();
      if(data && data[0]) allBudgets.push(data[0]);
    }
    setSyncStatus('synced');
    renderBudgets();
  } catch(e){ setSyncStatus('error'); }
}

async function saveLoan(loan){
  if(!_sb) return;
  try {
    var action = document.getElementById('loanAction').value;
    var editId = document.getElementById('loanEditId').value;
    if(action === 'edit' && editId){
      await _sb.from('loans').update({
        name:loan.name,total_amount:loan.total_amount,remaining_amount:loan.remaining_amount,
        interest_rate:loan.interest_rate,due_day:loan.due_day
      }).eq('id',editId);
      var idx = allLoans.findIndex(function(l){return l.id === editId});
      if(idx>=0) Object.assign(allLoans[idx],loan);
    } else {
      var {data} = await _sb.from('loans').insert([loan]).select();
      if(data && data[0]) allLoans.push(data[0]);
    }
    setSyncStatus('synced');
    renderLoans();
  } catch(e){ setSyncStatus('error'); }
}

async function saveRepayment(r){
  if(!_sb) return;
  try {
    var {data} = await _sb.from('repayments').insert([r]).select();
    if(data && data[0]){
      allRepayments.push(data[0]);
      var loan = allLoans.find(function(l){return l.id === r.loan_id});
      if(loan){
        var newRemaining = Math.max(0, loan.remaining_amount - r.amount);
        await _sb.from('loans').update({remaining_amount:newRemaining}).eq('id',loan.id);
        loan.remaining_amount = newRemaining;
      }
      setSyncStatus('synced');
      renderLoans();
    }
  } catch(e){ setSyncStatus('error'); }
}

// ========== MONTH HELPERS ==========
function changeMonth(delta){
  currentMonth += delta;
  if(currentMonth > 12){currentMonth = 1; currentYear++}
  if(currentMonth < 1){currentMonth = 12; currentYear--}
  document.getElementById('monthLabel').textContent = currentYear + '年' + currentMonth + '月';
  renderAll();
}

function getMonthTransactions(offset){
  var y = currentYear, m = currentMonth + (offset||0);
  if(m > 12){m -= 12; y++}
  if(m < 1){m += 12; y--}
  var prefix = y + '-' + String(m).padStart(2,'0');
  return allTransactions.filter(function(t){return t.date && t.date.startsWith(prefix)});
}

function formatMoney(n){
  if(n === undefined || n === null) n = 0;
  return '\u00a5' + Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
}

// ========== COUNT UP ANIMATION ==========
function countUp(el, target, prefix, duration){
  prefix = prefix || '\u00a5';
  duration = duration || 1200;
  var start = 0;
  var startTime = null;
  function step(ts){
    if(!startTime) startTime = ts;
    var progress = Math.min((ts - startTime) / duration, 1);
    var eased = 1 - Math.pow(1 - progress, 3);
    var current = start + (target - start) * eased;
    el.textContent = prefix + Number(current).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    if(progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ========== RENDER STATS ==========
function renderStats(){
  var curTx = getMonthTransactions(0);
  var prevTx = getMonthTransactions(-1);

  var income = 0, expense = 0;
  curTx.forEach(function(t){
    if(t.type === 'income') income += Number(t.amount)||0;
    else if(t.type === 'expense') expense += Number(t.amount)||0;
  });
  var prevIncome = 0, prevExpense = 0;
  prevTx.forEach(function(t){
    if(t.type === 'income') prevIncome += Number(t.amount)||0;
    else if(t.type === 'expense') prevExpense += Number(t.amount)||0;
  });

  countUp(document.getElementById('totalIncome'), income);
  countUp(document.getElementById('totalExpense'), expense);
  countUp(document.getElementById('totalBalance'), income - expense);

  var incChange = prevIncome > 0 ? ((income - prevIncome)/prevIncome*100).toFixed(1) : (income > 0 ? '100' : '0');
  var expChange = prevExpense > 0 ? ((expense - prevExpense)/prevExpense*100).toFixed(1) : (expense > 0 ? '100' : '0');

  document.getElementById('incomeChange').innerHTML = (incChange >= 0 ? '&#8593;':'&#8595;') + ' ' + Math.abs(incChange) + '% vs 上月';
  document.getElementById('incomeChange').className = 'stat-change ' + (incChange >= 0 ? 'up' : 'down');

  document.getElementById('expenseChange').innerHTML = (expChange >= 0 ? '&#8593;':'&#8595;') + ' ' + Math.abs(expChange) + '% vs 上月';
  document.getElementById('expenseChange').className = 'stat-change ' + (expChange >= 0 ? 'down' : 'up');

  var totalBudget = 0;
  allBudgets.forEach(function(b){totalBudget += Number(b.amount)||0});
  var budgetPct = totalBudget > 0 ? Math.min(100, Math.round(expense/totalBudget*100)) : 0;
  document.getElementById('budgetPercent').textContent = budgetPct + '%';
  document.getElementById('budgetPercent').style.color = budgetPct > 80 ? 'var(--red)' : budgetPct > 50 ? 'var(--yellow)' : 'var(--green)';
  setTimeout(function(){
    document.getElementById('budgetProgressFill').style.width = budgetPct + '%';
  }, 300);
}

// ========== RENDER ACCOUNTS ==========

  var grid = document.getElementById('accountsGrid');

  var balances = {};
  defaultAccounts.forEach(function(a){balances[a.id] = 0});
  curTx.forEach(function(t){
    var acc = t.account_id;
    if(t.type === 'income') balances[acc] = (balances[acc]||0) + Number(t.amount||0);
    else if(t.type === 'expense') balances[acc] = (balances[acc]||0) - Number(t.amount||0);
  });
  var html = '';
  defaultAccounts.forEach(function(a){
    html += '<div class="glass-card account-card" style="animation-delay:0.1s">' +
      '<div class="account-icon">' + a.icon + '</div>' +
      '<div class="account-name">' + a.name + '</div>' +
      '<div class="account-balance" style="color:' + (balances[a.id] >= 0 ? 'var(--text-primary)' : 'var(--red)') + '">' +
      formatMoney(balances[a.id]) + '</div></div>';
  });
  grid.innerHTML = html;
}

function renderDoughnutChart(){
  var curTx = getMonthTransactions(0);
  var catMap = {};
  curTx.forEach(function(t){
    if(t.type === 'expense'){
      catMap[t.category_id] = (catMap[t.category_id]||0) + Number(t.amount||0);
    }
  });
  var labels = [], data = [], colors = [];
  var totalExp = 0;
  expenseCategories.forEach(function(c){
    if(catMap[c.id]){
      labels.push(c.name);
      data.push(catMap[c.id]);
      colors.push(c.color);
      totalExp += catMap[c.id];
    }
  });
  document.getElementById('doughnutCenter').textContent = formatMoney(totalExp);

  var ctx = document.getElementById('doughnutChart').getContext('2d');
  if(doughnutChart) doughnutChart.destroy();
  doughnutChart = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels:labels,
      datasets:[{
        data:data,
        backgroundColor:colors,
        borderColor:'rgba(10,10,15,0.8)',
        borderWidth:3,
        hoverBorderColor:'rgba(255,255,255,0.2)',
        hoverBorderWidth:3,
        hoverOffset:8
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      cutout:'68%',
      plugins:{
        legend:{
          position:'bottom',
          labels:{
            color:'#8888a0',
            font:{family:'Inter',size:11},
            padding:12,
            usePointStyle:true,
            pointStyleWidth:8
          }
        },
        tooltip:{
          backgroundColor:'rgba(26,26,46,0.95)',
          borderColor:'rgba(255,255,255,0.1)',
          borderWidth:1,
          titleFont:{family:'Inter'},
          bodyFont:{family:'JetBrains Mono'},
          padding:12,
          cornerRadius:10,
          callbacks:{
            label:function(ctx){
              var pct = totalExp > 0 ? (ctx.parsed/totalExp*100).toFixed(1) : 0;
              return ' ' + ctx.label + ': ' + formatMoney(ctx.parsed) + ' (' + pct + '%)';
            }
          }
        }
      },
      animation:{animateRotate:true,animateScale:true,duration:1200,easing:'easeOutQuart'}
    }
  });
}

function renderBarChart(){
  var months = [];
  var incomeData = [];
  var expenseData = [];
  for(var i = 5; i >= 0; i--){
    var y = currentYear, m = currentMonth - i;
    if(m < 1){m += 12; y--}
    months.push(m + '月');
    var prefix = y + '-' + String(m).padStart(2,'0');
    var inc = 0, exp = 0;
    allTransactions.forEach(function(t){
      if(t.date && t.date.startsWith(prefix)){
        if(t.type === 'income') inc += Number(t.amount)||0;
        else if(t.type === 'expense') exp += Number(t.amount)||0;
      }
    });
    incomeData.push(inc);
    expenseData.push(exp);
  }

  var ctx = document.getElementById('barChart').getContext('2d');
  if(barChart) barChart.destroy();
  barChart = new Chart(ctx, {
    type:'bar',
    data:{
      labels:months,
      datasets:[
        {
          label:'收入',
          data:incomeData,
          backgroundColor:function(ctx2){
            var g = ctx2.chart.ctx.createLinearGradient(0,0,0,280);
            g.addColorStop(0,'rgba(34,197,94,0.8)');
            g.addColorStop(1,'rgba(34,197,94,0.1)');
            return g;
          },
          borderRadius:6,
          borderSkipped:false,
          barPercentage:0.6,
          categoryPercentage:0.7
        },
        {
          label:'支出',
          data:expenseData,
          backgroundColor:function(ctx2){
            var g = ctx2.chart.ctx.createLinearGradient(0,0,0,280);
            g.addColorStop(0,'rgba(239,68,68,0.8)');
            g.addColorStop(1,'rgba(239,68,68,0.1)');
            return g;
          },
          borderRadius:6,
          borderSkipped:false,
          barPercentage:0.6,
          categoryPercentage:0.7
        }
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      scales:{
        x:{
          grid:{color:'rgba(255,255,255,0.04)'},
          ticks:{color:'#8888a0',font:{family:'Inter',size:11}}
        },
        y:{
          grid:{color:'rgba(255,255,255,0.04)'},
          ticks:{
            color:'#8888a0',font:{family:'JetBrains Mono',size:11},
            callback:function(v){return v >= 1000 ? (v/1000)+'k' : v}
          }
        }
      },
      plugins:{
        legend:{
          labels:{color:'#8888a0',font:{family:'Inter',size:11},usePointStyle:true,pointStyleWidth:8,padding:16}
        },
        tooltip:{
          backgroundColor:'rgba(26,26,46,0.95)',
          borderColor:'rgba(255,255,255,0.1)',
          borderWidth:1,
          titleFont:{family:'Inter'},
          bodyFont:{family:'JetBrains Mono'},
          padding:12,
          cornerRadius:10,
          callbacks:{
            label:function(ctx2){return ' ' + ctx2.dataset.label + ': ' + formatMoney(ctx2.parsed.y)}
          }
        }
      },
      animation:{duration:1200,easing:'easeOutQuart'}
    }
  });
}

// ========== RENDER TRANSACTIONS ==========
function renderTransactions(){
  var list = document.getElementById('transactionList');
  var curTx = getMonthTransactions(0);
  document.getElementById('txCount').textContent = curTx.length + ' 笔';

  if(curTx.length === 0){
    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#128466;</div><div class="empty-state-text">本月暂无交易记录</div></div>';
    return;
  }

  var html = '';
  curTx.slice(0, 30).forEach(function(t, idx){
    var cat = getCatInfo(t.category_id, t.type);
    var isIncome = t.type === 'income';
    var sign = isIncome ? '+' : '-';
    var cls = isIncome ? 'income' : 'expense';
    html += '<div class="transaction-item" style="animation-delay:' + (idx * 0.05) + 's" data-id="' + t.id + '">' +
      '<div class="tx-icon" style="background:' + cat.color + '18;color:' + cat.color + '">' + cat.icon + '</div>' +
      '<div class="tx-info"><div class="tx-category">' + cat.name + '</div>' +
      '<div class="tx-meta"><span>' + (t.note || '无备注') + '</span><span>' + (t.date||'') + '</span></div></div>' +
      '<div class="tx-amount ' + cls + '">' + sign + formatMoney(t.amount) + '</div>' +
      '<button class="tx-delete" onclick="removeTx(this)" title="删除">&#128465;</button></div>';
  });
  list.innerHTML = html;
}

function getCatInfo(catId, type){
  var cats = type === 'income' ? incomeCategories : expenseCategories;
  var found = cats.find(function(c){return c.id === catId});
  return found || {name:'未知',icon:'&#10067;',color:'#78716c'};
}

function removeTx(btn){
  var item = btn.closest('.transaction-item');
  var id = item.dataset.id;
  item.classList.add('removing');
  setTimeout(function(){
    deleteTransaction(id);
    showToast('已删除','success');
  }, 400);
}

// ========== RENDER BUDGETS ==========
function renderBudgets(){
  var list = document.getElementById('budgetList');
  var curTx = getMonthTransactions(0);
  if(allBudgets.length === 0){
    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#128203;</div><div class="empty-state-text">暂未设置预算</div></div>';
    return;
  }
  var html = '';
  allBudgets.forEach(function(b){
    var cat = expenseCategories.find(function(c){return c.id === b.category_id});
    if(!cat) return;
    var spent = 0;
    curTx.forEach(function(t){
      if(t.type === 'expense' && t.category_id === b.category_id) spent += Number(t.amount)||0;
    });
    var pct = Number(b.amount) > 0 ? Math.min(100, Math.round(spent/Number(b.amount)*100)) : 0;
    var color = pct > 80 ? 'var(--red)' : pct > 50 ? 'var(--yellow)' : 'var(--green)';
    html += '<div class="budget-item"><div class="budget-header">' +
      '<span class="budget-name">' + cat.icon + ' ' + cat.name + '</span>' +
      '<span class="budget-value" style="color:' + color + '">' + formatMoney(spent) + ' / ' + formatMoney(b.amount) + '</span></div>' +
      '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%;background:' + color + '"></div></div></div>';
  });
  list.innerHTML = html;
}

// ========== RENDER LOANS ==========
function renderLoans(){
  var list = document.getElementById('loanList');
  if(allLoans.length === 0){
    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#128179;</div><div class="empty-state-text">暂无贷款记录</div></div>';
    return;
  }
  var html = '';
  allLoans.forEach(function(l){
    var rate = Number(l.interest_rate)||0;
    var monthlyInterest = (Number(l.remaining_amount)||0) * rate / 100 / 12;
    var totalRepay = 0;
    allRepayments.forEach(function(r){
      if(r.loan_id === l.id) totalRepay += Number(r.amount)||0;
    });
    html += '<div class="glass-card loan-card" style="animation-delay:0.1s;padding:16px">' +
      '<div class="loan-header"><div class="loan-title">' + (l.name||'贷款') + '</div>' +
      '<div style="display:flex;gap:8px">' +
      '<button class="btn btn-sm btn-primary" onclick="openRepayModal(\'' + l.id + '\')">还款</button>' +
      '<button class="btn btn-sm btn-ghost" onclick="editLoan(\'' + l.id + '\')">编辑</button></div></div>' +
      '<div class="loan-amount">' + formatMoney(l.remaining_amount) + ' / ' + formatMoney(l.total_amount) + '</div>' +
      '<div class="loan-details" style="margin-top:12px">' +
      '<div class="loan-detail"><div class="loan-detail-label">年利率</div><div class="loan-detail-value">' + rate + '%</div></div>' +
      '<div class="loan-detail"><div class="loan-detail-label">月利息</div><div class="loan-detail-value" style="color:var(--orange)">' + formatMoney(monthlyInterest) + '</div></div>' +
      '<div class="loan-detail"><div class="loan-detail-label">已还</div><div class="loan-detail-value" style="color:var(--green)">' + formatMoney(totalRepay) + '</div></div>' +
      '</div></div>';
  });
  list.innerHTML = html;
}

// ========== MODAL FUNCTIONS ==========
function openModal(type){
  selectedCategory = null;
  document.getElementById('txType').value = type;
  var title = type === 'income' ? '记一笔收入' : type === 'expense' ? '记一笔支出' : '转账';
  document.getElementById('txModalTitle').textContent = title;

  var cats = type === 'income' ? incomeCategories : expenseCategories;
  var grid = document.getElementById('categoryGrid');
  var html = '';
  cats.forEach(function(c){
    html += '<div class="category-item" data-id="' + c.id + '" onclick="selectCategory(this,\'' + c.id + '\')">' +
      '<span class="category-item-icon">' + c.icon + '</span>' +
      '<span class="category-item-name">' + c.name + '</span></div>';
  });
  grid.innerHTML = html;

  var accSelect = document.getElementById('txAccount');
  var toSelect = document.getElementById('txToAccount');
  var opts = '';
  defaultAccounts.forEach(function(a){
    opts += '<option value="' + a.id + '">' + a.icon + ' ' + a.name + '</option>';
  });
  accSelect.innerHTML = opts;
  toSelect.innerHTML = opts;

  document.getElementById('txToAccountGroup').style.display = type === 'transfer' ? 'block' : 'none';
  document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('txAmount').value = '';
  document.getElementById('txNote').value = '';

  var btn = document.getElementById('txSubmitBtn');
  if(type === 'income') btn.className = 'btn btn-primary';
  else if(type === 'expense') btn.className = 'btn btn-expense';
  else btn.className = 'btn btn-primary';
  btn.style.cssText = 'width:100%;justify-content:center;padding:14px;font-size:15px';

  openModalEl('txModal');
}

function selectCategory(el, id){
  document.querySelectorAll('#categoryGrid .category-item').forEach(function(e){e.classList.remove('selected')});
  el.classList.add('selected');
  selectedCategory = id;
}

function openModalEl(id){
  var overlay = document.getElementById(id);
  overlay.style.display = 'flex';
  requestAnimationFrame(function(){
    overlay.classList.add('active');
  });
}

function closeModal(id){
  var overlay = document.getElementById(id);
  overlay.classList.remove('active');
  setTimeout(function(){overlay.style.display = 'none'}, 300);
}

function handleTxSubmit(e){
  e.preventDefault();
  var type = document.getElementById('txType').value;
  var amount = document.getElementById('txAmount').value;
  var account = document.getElementById('txAccount').value;
  var note = document.getElementById('txNote').value;
  var date = document.getElementById('txDate').value;

  if(type === 'transfer'){
    var toAccount = document.getElementById('txToAccount').value;
    if(account === toAccount){showToast('转出和转入账户不能相同','error');return}
    var tx1 = {type:'expense',amount:amount,category_id:'transfer',account_id:account,to_account_id:toAccount,note:note||('转账至'+toAccount),date:date};
    var tx2 = {type:'income',amount:amount,category_id:'transfer',account_id:toAccount,to_account_id:account,note:note||('来自'+account),date:date};
    saveTransaction(tx1);
    setTimeout(function(){saveTransaction(tx2)}, 200);
  } else {
    if(!selectedCategory){showToast('请选择分类','error');return}
    var tx = {type:type,amount:amount,category_id:selectedCategory,account_id:account,note:note,date:date};
    saveTransaction(tx);
  }
  closeModal('txModal');
  showToast('记账成功','success');
}

// ========== BUDGET MODAL ==========
function openBudgetModal(){
  var sel = document.getElementById('budgetCategory');
  var html = '';
  expenseCategories.forEach(function(c){
    html += '<option value="' + c.id + '">' + c.icon + ' ' + c.name + '</option>';
  });
  sel.innerHTML = html;
  document.getElementById('budgetAmount').value = '';
  openModalEl('budgetModal');
}

function handleBudgetSubmit(e){
  e.preventDefault();
  var catId = document.getElementById('budgetCategory').value;
  var amount = document.getElementById('budgetAmount').value;
  saveBudget({category_id:catId,amount:amount});
  closeModal('budgetModal');
  showToast('预算已设置','success');
}

// ========== LOAN MODAL ==========
function openLoanModal(){
  document.getElementById('loanAction').value = 'add';
  document.getElementById('loanEditId').value = '';
  document.getElementById('loanModalTitle').textContent = '新增贷款';
  document.getElementById('loanName').value = '';
  document.getElementById('loanTotal').value = '';
  document.getElementById('loanRemaining').value = '';
  document.getElementById('loanRate').value = '0';
  document.getElementById('loanDueDay').value = '';
  openModalEl('loanModal');
}

function editLoan(id){
  var loan = allLoans.find(function(l){return l.id === id});
  if(!loan) return;
  document.getElementById('loanAction').value = 'edit';
  document.getElementById('loanEditId').value = id;
  document.getElementById('loanModalTitle').textContent = '编辑贷款';
  document.getElementById('loanName').value = loan.name || '';
  document.getElementById('loanTotal').value = loan.total_amount || '';
  document.getElementById('loanRemaining').value = loan.remaining_amount || '';
  document.getElementById('loanRate').value = loan.interest_rate || 0;
  document.getElementById('loanDueDay').value = loan.due_day || '';
  openModalEl('loanModal');
}

function handleLoanSubmit(e){
  e.preventDefault();
  var loan = {
    name:document.getElementById('loanName').value,
    total_amount:document.getElementById('loanTotal').value,
    remaining_amount:document.getElementById('loanRemaining').value,
    interest_rate:document.getElementById('loanRate').value,
    due_day:document.getElementById('loanDueDay').value
  };
  saveLoan(loan);
  closeModal('loanModal');
  showToast('贷款已保存','success');
}

// ========== REPAY MODAL ==========
function openRepayModal(loanId){
  document.getElementById('repayLoanId').value = loanId;
  document.getElementById('repayAmount').value = '';
  document.getElementById('repayDate').value = new Date().toISOString().split('T')[0];
  openModalEl('repayModal');
}

function handleRepaySubmit(e){
  e.preventDefault();
  var r = {
    loan_id:document.getElementById('repayLoanId').value,
    amount:document.getElementById('repayAmount').value,
    date:document.getElementById('repayDate').value
  };
  saveRepayment(r);
  closeModal('repayModal');
  showToast('还款成功','success');
}

// ========== EXPORT EXCEL ==========
function exportExcel(){
  if(typeof XLSX === 'undefined'){showToast('Excel库加载中，请稍后','error');return}
  var curTx = getMonthTransactions(0);
  if(curTx.length === 0){showToast('本月无数据可导出','error');return}
  var rows = [['日期','类型','分类','金额','账户','备注']];
  curTx.forEach(function(t){
    var cat = getCatInfo(t.category_id, t.type);
    var acc = defaultAccounts.find(function(a){return a.id === t.account_id});
    rows.push([t.date, t.type==='income'?'收入':'支出', cat.name, Number(t.amount), acc?acc.name:t.account_id, t.note||'']);
  });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, currentYear+'年'+currentMonth+'月');
  XLSX.writeFile(wb, '记账_'+currentYear+'年'+currentMonth+'月+'.xlsx');
  showToast('导出成功','success');
}

// ========== TOAST ==========
function showToast(msg, type){
  type = type || 'success';
  var container = document.getElementById('toastContainer');
  var toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(function(){
    toast.classList.add('removing');
    setTimeout(function(){toast.remove()}, 300);
  }, 2500);
}

// ========== CARD ANIMATIONS ==========
function animateCards(){
  var cards = document.querySelectorAll('.glass-card:not(.visible)');
  cards.forEach(function(card, i){
    setTimeout(function(){
      card.classList.add('visible');
    }, i * 100);
  });
}

// ========== MOUSE GLOW EFFECT ==========
document.addEventListener('mousemove', function(e){
  var glow = document.getElementById('bgGlow');
  var x = (e.clientX / window.innerWidth - 0.5) * 60;
  var y = (e.clientY / window.innerHeight - 0.5) * 30;
  glow.style.transform = 'translateX(calc(-50% + ' + x + 'px)) translateY(' + y + 'px)';
});

// ========== SCROLL EFFECTS ==========
var lastScrollY = 0;
window.addEventListener('scroll', function(){
  var navbar = document.getElementById('navbar');
  if(window.scrollY > 20) navbar.classList.add('scrolled');
  else navbar.classList.remove('scrolled');

  // Parallax for cards
  var cards = document.querySelectorAll('.glass-card.visible');
  cards.forEach(function(card){
    var rect = card.getBoundingClientRect();
    var centerY = rect.top + rect.height / 2;
    var screenCenter = window.innerHeight / 2;
    var offset = (centerY - screenCenter) * 0.02;
    card.style.transform = 'translateY(' + offset + 'px)';
  });
}, {passive:true});

// ========== CLOSE MODAL ON OVERLAY CLICK ==========
document.querySelectorAll('.modal-overlay').forEach(function(overlay){
  overlay.addEventListener('click', function(e){
    if(e.target === overlay) closeModal(overlay.id);
  });
});

// ========== KEYBOARD SHORTCUTS ==========
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    document.querySelectorAll('.modal-overlay.active').forEach(function(m){closeModal(m.id)});
  }
});

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('monthLabel').textContent = currentYear + '年' + currentMonth + '月';
  document.getElementById('txDate').value = new Date().toISOString().split('T')[0];

  // Show skeleton loading
  showSkeletons();

  waitForSupabase(function(){
    loadData();
  });
});

function showSkeletons(){
  // Brief skeleton display then reveal
  setTimeout(function(){
    animateCards();
  }, 200);
}
</script>
