            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('budgetModal')">取消</button>
                <button class="btn btn-primary" onclick="saveBudget()">保存预算</button>
            </div>
        </div>
    </div>

    <!-- Loan Modal -->
    <div class="modal-overlay" id="loanModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">➕ 新增借款</h3>
                <button class="modal-close" onclick="closeModal('loanModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">借款人</label>
                    <input type="text" class="form-input" id="loanBorrower" placeholder="借款人姓名">
                </div>
                <div class="form-group">
                    <label class="form-label">借款金额</label>
                    <input type="number" class="form-input" id="loanAmount" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label class="form-label">借款日期</label>
                    <input type="date" class="form-input" id="loanDate">
                </div>
                <div class="form-group">
                    <label class="form-label">年利率 (%)</label>
                    <input type="number" class="form-input" id="loanRate" value="17.64" step="0.01">
                    <small style="color: var(--text-muted);">默认年利率 17.64%，日利率约 0.0483%</small>
                </div>
                <div class="form-group">
                    <label class="form-label">备注</label>
                    <input type="text" class="form-input" id="loanNote" placeholder="可选">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('loanModal')">取消</button>
                <button class="btn btn-primary" onclick="saveLoan()">保存</button>
            </div>
        </div>
    </div>

    <!-- Repayment Modal -->
    <div class="modal-overlay" id="repaymentModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">💵 记录还款</h3>
                <button class="modal-close" onclick="closeModal('repaymentModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">选择借款</label>
                    <select class="form-select" id="repaymentLoan">
                        <!-- Active loans will be populated -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">还款金额</label>
                    <input type="number" class="form-input" id="repaymentAmount" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label class="form-label">还款日期</label>
                    <input type="date" class="form-input" id="repaymentDate">
                </div>
                <div class="form-group">
                    <label class="form-label">还款类型</label>
                    <select class="form-select" id="repaymentType">
                        <option value="principal">本金</option>
                        <option value="interest">利息</option>
                        <option value="both">本金+利息</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('repaymentModal')">取消</button>
                <button class="btn btn-primary" onclick="saveRepayment()">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==========================================
        // Global Variables
        // ==========================================
        var _sb = null;
        var currentTransactionType = 'expense';
        var selectedCategory = null;
        var accounts = [];
        var categories = [];
        var transactions = [];
        var budgets = [];
        var loans = [];
        var repayments = [];
        var expenseChart = null;
        var trendChart = null;
        var currentAccountFilter = '';

        // ==========================================
        // Supabase Configuration
        // ==========================================
        var SUPABASE_URL = 'https://vjildthiuxhoukakvtui.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqaWxkdGhpdXhob3VrYWt2dHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMTA1MDgsImV4cCI6MjA5MzU4NjUwOH0.HAb9Vz8u0uBXOqyxrrBGlH-M9mYwEQa2kYZ_7qdKAgg';

        // ==========================================
        // Category Definitions
        // ==========================================
        var EXPENSE_CATEGORIES = [
            { id: 'food', name: '餐饮', icon: '🍔', color: '#e87a3d' },
            { id: 'transport', name: '交通', icon: '🚗', color: '#5b7ba3' },
            { id: 'shopping', name: '购物', icon: '🛍️', color: '#c4501a' },
            { id: 'entertainment', name: '娱乐', icon: '🎬', color: '#9b59b6' },
            { id: 'housing', name: '居住', icon: '🏠', color: '#2d8a4e' },
            { id: 'medical', name: '医疗', icon: '🏥', color: '#e74c3c' },
            { id: 'education', name: '教育', icon: '📚', color: '#3498db' },
            { id: 'utilities', name: '水电', icon: '💡', color: '#f39c12' },
            { id: 'communication', name: '通讯', icon: '📱', color: '#1abc9c' },
            { id: 'clothing', name: '服饰', icon: '👔', color: '#e91e63' },
            { id: 'beauty', name: '美容', icon: '💄', color: '#ff69b4' },
            { id: 'sports', name: '运动', icon: '⚽', color: '#27ae60' },
            { id: 'travel', name: '旅游', icon: '✈️', color: '#3498db' },
            { id: 'pet', name: '宠物', icon: '🐾', color: '#8b4513' },
            { id: 'gift', name: '礼物', icon: '🎁', color: '#e74c3c' },
            { id: 'donation', name: '捐赠', icon: '❤️', color: '#e74c3c' },
            { id: 'insurance', name: '保险', icon: '🛡️', color: '#34495e' },
            { id: 'other_expense', name: '其他', icon: '📦', color: '#95a5a6' }
        ];

        var INCOME_CATEGORIES = [
            { id: 'salary', name: '工资', icon: '💼', color: '#2d8a4e' },
            { id: 'bonus', name: '奖金', icon: '🎉', color: '#e87a3d' },
            { id: 'investment', name: '投资', icon: '📈', color: '#3498db' },
            { id: 'parttime', name: '兼职', icon: '💪', color: '#9b59b6' },
            { id: 'gift_income', name: '礼金', icon: '🧧', color: '#e74c3c' },
            { id: 'refund', name: '退款', icon: '↩️', color: '#1abc9c' },
            { id: 'other_income', name: '其他', icon: '💰', color: '#95a5a6' }
        ];

        var TRANSFER_CATEGORIES = [
            { id: 'transfer', name: '转账', icon: '🔄', color: '#5b7ba3' }
        ];

        // ==========================================
        // Initialization
        // ==========================================
        function waitForSupabase(callback) {
            if (typeof supabase !== 'undefined' && supabase.createClient) {
                _sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                callback();
            } else {
                setTimeout(function() {
                    waitForSupabase(callback);
                }, 100);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Set today's date for date inputs
            var today = new Date().toISOString().split('T')[0];
            document.getElementById('transactionDate').value = today;
            document.getElementById('loanDate').value = today;
            document.getElementById('repaymentDate').value = today;

            // Initialize Supabase
            waitForSupabase(function() {
                console.log('Supabase initialized');
                updateSyncStatus('syncing');
                initializeData();
            });

            // Setup month filter
            setupMonthFilter();
        });

        // ==========================================
        // Data Loading
        // ==========================================
        async function initializeData() {
            try {
                await Promise.all([
                    loadAccounts(),
                    loadCategories(),
                    loadTransactions(),
                    loadBudgets(),
                    loadLoans(),
                    loadRepayments()
                ]);
                
                renderAll();
                updateSyncStatus('synced');
                showToast('数据同步成功', 'success');
            } catch (error) {
                console.error('Error initializing data:', error);
                updateSyncStatus('error');
                showToast('数据同步失败: ' + error.message, 'error');
            }
        }

        async function loadAccounts() {
            var result = await _sb.from('accounts').select('*').order('id');
            if (result.error) throw result.error;
            accounts = result.data || [];
        }

        async function loadCategories() {
            var result = await _sb.from('categories').select('*').order('id');
            if (result.error) throw result.error;
            categories = result.data || [];
        }

        async function loadTransactions() {
            var result = await _sb.from('transactions')
                .select('*')
                .order('date', { ascending: false })
                .order('created_at', { ascending: false });
            if (result.error) throw result.error;
            transactions = result.data || [];
        }

        async function loadBudgets() {
            var result = await _sb.from('budgets').select('*');
            if (result.error) throw result.error;
            budgets = result.data || [];
        }

        async function loadLoans() {
            var result = await _sb.from('loans').select('*').order('date', { ascending: false });
            if (result.error) throw result.error;
            loans = result.data || [];
        }

        async function loadRepayments() {
            var result = await _sb.from('repayments').select('*').order('date', { ascending: false });
            if (result.error) throw result.error;
            repayments = result.data || [];
        }

        // ==========================================
        // Rendering Functions
        // ==========================================
        function renderAll() {
            renderAccounts();
            renderSummary();
            renderBudget();
            renderCategoryGrid();
            renderCharts();
            renderLoans();
            renderTransactions();
            updateAccountFilter();
        }

        function renderAccounts() {
            var grid = document.getElementById('accountsGrid');
            var accountIcons = {
                'cash': '💵',
                'bank': '💳',
                'alipay': '🔵',
                'wechat': '🟢',
                'credit': '💰'
            };
            
            var accountNames = {
                'cash': '现金',
                'bank': '银行卡',
                'alipay': '支付宝',
                'wechat': '微信',
                'credit': '信用卡'
            };

            grid.innerHTML = accounts.map(function(account) {
                var isCredit = account.type === 'credit';
                var activeClass = currentAccountFilter === account.id ? 'active' : '';
                return `
                    <div class="account-card ${isCredit ? 'credit' : ''} ${activeClass}" 
                         onclick="selectAccount('${account.id}')" 
                         style="animation-delay: ${account.id * 0.05}s">
                        <div class="account-icon">${accountIcons[account.type] || '💳'}</div>
                        <div class="account-name">${accountNames[account.type] || account.name}</div>
                        <div class="account-balance">¥${formatMoney(account.balance)}</div>
                    </div>
                `;
            }).join('');
        }

        function renderSummary() {
            var currentMonth = new Date().toISOString().slice(0, 7);
            var monthTransactions = transactions.filter(function(t) {
                return t.date && t.date.startsWith(currentMonth);
            });

            var income = monthTransactions
                .filter(function(t) { return t.type === 'income'; })
                .reduce(function(sum, t) { return sum + (parseFloat(t.amount) || 0); }, 0);

            var expense = monthTransactions
                .filter(function(t) { return t.type === 'expense'; })
                .reduce(function(sum, t) { return sum + (parseFloat(t.amount) || 0); }, 0);

            var balance = income - expense;

            document.getElementById('monthIncome').textContent = '¥' + formatMoney(income);
            document.getElementById('monthExpense').textContent = '¥' + formatMoney(expense);
            document.getElementById('monthBalance').textContent = '¥' + formatMoney(balance);
        }

        function renderBudget() {
            var currentMonth = new Date().toISOString().slice(0, 7);
            var budget = budgets.find(function(b) {
                return b.period === 'monthly' && b.month === currentMonth;
            });

            var budgetSection = document.getElementById('budgetSection');
            
            if (!budget || !budget.amount) {
                budgetSection.style.display = 'none';
                return;
            }

            budgetSection.style.display = 'block';

            var monthExpense = transactions
                .filter(function(t) {
                    return t.type === 'expense' && t.date && t.date.startsWith(currentMonth);
                })
                .reduce(function(sum, t) { return sum + (parseFloat(t.amount) || 0); }, 0);

            var percentage = Math.min((monthExpense / budget.amount) * 100, 100);
            var progressFill = document.getElementById('budgetProgress');
            
            progressFill.style.width = percentage + '%';
            progressFill.className = 'progress-fill';
            
            if (percentage >= 100) {
                progressFill.classList.add('danger');
            } else if (percentage >= 80) {
                progressFill.classList.add('warning');
            }

            document.getElementById('budgetStats').textContent = 
                '已用 ¥' + formatMoney(monthExpense) + ' / ¥' + formatMoney(budget.amount);
        }

        function renderCategoryGrid() {
            var grid = document.getElementById('categoryGrid');
            var cats = currentTransactionType === 'income' ? INCOME_CATEGORIES : 
                      currentTransactionType === 'transfer' ? TRANSFER_CATEGORIES : 
                      EXPENSE_CATEGORIES;

            grid.innerHTML = cats.map(function(cat) {
                var selected = selectedCategory === cat.id ? 'selected' : '';
                return `
                    <div class="category-option ${selected}" onclick="selectCategory('${cat.id}')">
                        <span class="icon">${cat.icon}</span>
                        <span class="name">${cat.name}</span>
                    </div>
                `;
            }).join('');
        }

        function renderCharts() {
            renderExpenseChart();
            renderTrendChart();
        }

        function renderExpenseChart() {
            var ctx = document.getElementById('expenseChart').getContext('2d');
            var currentMonth = new Date().toISOString().slice(0, 7);
            
            var monthExpenses = transactions.filter(function(t) {
                return t.type === 'expense' && t.date && t.date.startsWith(currentMonth);
            });

            var categoryTotals = {};
            monthExpenses.forEach(function(t) {
                var cat = t.category || 'other_expense';
                categoryTotals[cat] = (categoryTotals[cat] || 0) + (parseFloat(t.amount) || 0);
            });

            var labels = [];
            var data = [];
            var colors = [];

            Object.keys(categoryTotals).forEach(function(catId) {
                var cat = EXPENSE_CATEGORIES.find(function(c) { return c.id === catId; }) || 
                         { name: '其他', color: '#95a5a6' };
                if (categoryTotals[catId] > 0) {
                    labels.push(cat.name);
                    data.push(categoryTotals[catId]);
                    colors.push(cat.color);
                }
            });

            if (expenseChart) {
                expenseChart.destroy();
            }

            if (data.length === 0) {
                ctx.font = '14px "Noto Sans SC"';
                ctx.fillStyle = '#9a9590';
                ctx.textAlign = 'center';
                ctx.fillText('暂无支出数据', ctx.canvas.width / 2, ctx.canvas.height / 2);
                return;
            }

            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                font: { family: 'Noto Sans SC', size: 12 },
                                padding: 15
                            }
                        }
                    }
                }
            });
        }

        function renderTrendChart() {
            var ctx = document.getElementById('trendChart').getContext('2d');
            
            var months = [];
            var incomeData = [];
            var expenseData = [];

            for (var i = 5; i >= 0; i--) {
                var d = new Date();
                d.setMonth(d.getMonth() - i);
                var monthStr = d.toISOString().slice(0, 7);
                months.push(d.getMonth() + 1 + '月');

                var monthTrans = transactions.filter(function(t) {
                    return t.date && t.date.startsWith(monthStr);
                });

                var income = monthTrans
                    .filter(function(t) { return t.type === 'income'; })
                    .reduce(function(sum, t) { return sum + (parseFloat(t.amount) || 0); }, 0);

                var expense = monthTrans
                    .filter(function(t) { return t.type === 'expense'; })
                    .reduce(function(sum, t) { return sum + (parseFloat(t.amount) || 0); }, 0);

                incomeData.push(income);
                expenseData.push(expense);
            }

            if (trendChart) {
                trendChart.destroy();
            }

            trendChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: months,
                    datasets: [
                        {
                            label: '收入',
                            data: incomeData,
                            backgroundColor: '#2d8a4e',
                            borderRadius: 4
                        },
                        {
                            label: '支出',
                            data: expenseData,
                            backgroundColor: '#c4501a',
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { font: { family: 'Noto Sans SC', size: 12 } }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                font: { family: 'Noto Sans SC', size: 11 },
                                callback: function(value) {
                                    return '¥' + (value / 1000).toFixed(0) + 'k';
                                }
                            }
                        },
                        x: {
                            ticks: { font: { family: 'Noto Sans SC', size: 12 } }
                        }
                    }
                }
            });
        }

        function renderLoans() {
            var loanStats = document.getElementById('loanStats');
            var loanList = document.getElementById('loanList');

            var totalPrincipal = 0;
            var totalInterest = 0;
            var totalRepaid = 0;

            loans.forEach(function(loan) {
                var loanRepayments = repayments.filter(function(r) { return r.loan_id === loan.id; });
                var repaidPrincipal = loanRepayments
                    .filter(function(r) { return r.type === 'principal' || r.type === 'both'; })
                    .reduce(function(sum, r) { return sum + (parseFloat(r.amount) || 0); }, 0);
                
                var principal = parseFloat(loan.amount) || 0;
                var days = Math.max(1, Math.floor((new Date() - new Date(loan.date)) / (1000 * 60 * 60 * 24)));
                var rate = parseFloat(loan.interest_rate) || 17.64;
                var interest = principal * (rate / 100) * (days / 365);

                totalPrincipal += principal;
                totalInterest += interest;
                totalRepaid += repaidPrincipal;
            });

            var totalOwed = totalPrincipal + totalInterest - totalRepaid;

            loanStats.innerHTML = `
                <div class="loan-stat">
                    <div class="loan-stat-value">¥${formatMoney(totalPrincipal)}</div>
                    <div class="loan-stat-label">借款本金</div>
                </div>
                <div class="loan-stat">
                    <div class="loan-stat-value">¥${formatMoney(totalInterest)}</div>
                    <div class="loan-stat-label">累计利息</div>
                </div>
                <div class="loan-stat">
                    <div class="loan-stat-value">¥${formatMoney(totalRepaid)}</div>
                    <div class="loan-stat-label">已还金额</div>
                </div>
                <div class="loan-stat">
                    <div class="loan-stat-value">¥${formatMoney(totalOwed)}</div>
                    <div class="loan-stat-label">待还金额</div>
                </div>
            `;

            if (loans.length === 0) {
                loanList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💳</div>
                        <p>暂无借款记录</p>
                    </div>
                `;
                return;
            }

            loanList.innerHTML = loans.slice(0, 5).map(function(loan, index) {
                var loanRepayments = repayments.filter(function(r) { return r.loan_id === loan.id; });
                var repaid = loanRepayments.reduce(function(sum, r) { return sum + (parseFloat(r.amount) || 0); }, 0);
                var principal = parseFloat(loan.amount) || 0;
                var days = Math.max(1, Math.floor((new Date() - new Date(loan.date)) / (1000 * 60 * 60 * 24)));
                var rate = parseFloat(loan.interest_rate) || 17.64;
                var interest = principal * (rate / 100) * (days / 365);
                var remaining = principal + interest - repaid;

                return `
                    <div class="transaction-item" style="animation-delay: ${index * 0.05}s">
                        <div class="transaction-icon expense">💳</div>
                        <div class="transaction-info">
                            <div class="transaction-category">${loan.borrower || '未知借款人'}</div>
                            <div class="transaction-meta">
                                <span>本金: ¥${formatMoney(principal)}</span>
                                <span>利息: ¥${formatMoney(interest)}</span>
                                <span>${loan.date}</span>
                            </div>
                        </div>
                        <div class="transaction-amount expense">¥${formatMoney(remaining)}</div>
                    </div>
                `;
            }).join('');
        }

        function renderTransactions() {
            var list = document.getElementById('transactionList');
            var monthFilter = document.getElementById('monthFilter').value;
            var accountFilter = currentAccountFilter;
            var searchText = document.getElementById('searchInput').value.toLowerCase();

            var filtered = transactions.filter(function(t) {
                if (monthFilter && !t.date.startsWith(monthFilter)) return false;
                if (accountFilter && t.from_account !== accountFilter && t.to_account !== accountFilter) return false;
                if (searchText && t.note && !t.note.toLowerCase().includes(searchText)) return false;
                return true;
            });

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>暂无交易记录</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.slice(0, 50).map(function(t, index) {
                var cat = getCategory(t.category, t.type);
                var fromAcc = accounts.find(function(a) { return a.id === t.from_account; });
                var toAcc = accounts.find(function(a) { return a.id === t.to_account; });
                
                var accountText = '';
                if (t.type === 'transfer' && fromAcc && toAcc) {
                    accountText = (fromAcc.name || fromAcc.type) + ' → ' + (toAcc.name || toAcc.type);
                } else if (fromAcc) {
                    accountText = fromAcc.name || fromAcc.type;
                }

                var amountClass = t.type === 'income' ? 'income' : t.type === 'expense' ? 'expense' : '';
                var amountPrefix = t.type === 'income' ? '+' : t.type === 'expense' ? '-' : '';

                return `
                    <div class="transaction-item" style="animation-delay: ${index * 0.03}s">
                        <div class="transaction-icon ${t.type}">${cat.icon}</div>
                        <div class="transaction-info">
                            <div class="transaction-category">${cat.name}</div>
                            <div class="transaction-meta">
                                <span>${accountText}</span>
                                <span>${t.date}</span>
                                ${t.note ? '<span>' + t.note + '</span>' : ''}
                            </div>
                        </div>
                        <div class="transaction-amount ${amountClass}">${amountPrefix}¥${formatMoney(t.amount)}</div>
                        <div class="transaction-actions">
                            <button class="btn btn-danger btn-small" onclick="deleteTransaction('${t.id}')">删除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // Helper Functions
        // ==========================================
        function formatMoney(amount) {
            var num = parseFloat(amount) || 0;
            return num.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function getCategory(catId, type) {
            var cats = type === 'income' ? INCOME_CATEGORIES : 
                      type === 'transfer' ? TRANSFER_CATEGORIES : 
                      EXPENSE_CATEGORIES;
            return cats.find(function(c) { return c.id === catId; }) || 
                   { name: '其他', icon: '📦', color: '#95a5a6' };
        }

        function updateSyncStatus(status) {
            var el = document.getElementById('syncStatus');
            el.className = 'sync-status ' + status;
            
            if (status === 'syncing') {
                el.textContent = '同步中...';
            } else if (status === 'synced') {
                el.textContent = '已同步';
            } else if (status === 'error') {
                el.textContent = '同步失败';
            }
        }

        function showToast(message, type) {
            var container = document.getElementById('toastContainer');
            var icons = { success: '✓', error: '✗', warning: '⚠' };
            
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.innerHTML = `
                <span class="toast-icon">${icons[type] || 'ℹ'}</span>
                <span class="toast-message">${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            
            container.appendChild(toast);
            
            setTimeout(function() {
                toast.remove();
            }, 4000);
        }

        function setupMonthFilter() {
            var select = document.getElementById('monthFilter');
            var currentDate = new Date();
            
            for (var i = 0; i < 12; i++) {
                var d = new Date(currentDate.getFullYear(), currentDate.getMonth() - i, 1);
                var value = d.toISOString().slice(0, 7);
                var label = d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
                
                var option = document.createElement('option');
                option.value = value;
                option.textContent = label;
                select.appendChild(option);
            }
        }

        function updateAccountFilter() {
            var select = document.getElementById('accountFilter');
            select.innerHTML = '<option value="">所有账户</option>';
            
            accounts.forEach(function(account) {
                var option = document.createElement('option');
                option.value = account.id;
                option.textContent = account.name || account.type;
                select.appendChild(option);
            });
        }

        // ==========================================
        // Event Handlers
        // ==========================================
        function selectAccount(accountId) {
            if (currentAccountFilter === accountId) {
                currentAccountFilter = '';
            } else {
                currentAccountFilter = accountId;
            }
            renderAccounts();
            renderTransactions();
        }

        function filterByMonth() {
            renderTransactions();
        }

        function filterByAccount() {
            currentAccountFilter = document.getElementById('accountFilter').value;
            renderAccounts();
            renderTransactions();
        }

        function searchTransactions() {
            renderTransactions();
        }

        function switchTransactionType(type) {
            currentTransactionType = type;
            selectedCategory = null;
            
            // Update tabs
            document.querySelectorAll('#transactionTabs .tab').forEach(function(tab) {
                tab.classList.toggle('active', tab.dataset.type === type);
            });

            // Update labels and visibility
            var fromLabel = document.getElementById('fromAccountLabel');
            var toGroup = document.getElementById('toAccountGroup');
            
            if (type === 'income') {
                fromLabel.textContent = '存入账户';
                toGroup.style.display = 'none';
            } else if (type === 'expense') {
                fromLabel.textContent = '支出账户';
                toGroup.style.display = 'none';
            } else {
                fromLabel.textContent = '转出账户';
                toGroup.style.display = 'block';
            }

            renderCategoryGrid();
        }

        function selectCategory(catId) {
            selectedCategory = catId;
            renderCategoryGrid();
        }

        // ==========================================
        // Modal Functions
        // ==========================================
        function openTransactionModal(type) {
            currentTransactionType = type;
            selectedCategory = null;
            switchTransactionType(type);
            
            // Populate account selects
            var fromSelect = document.getElementById('fromAccount');
            var toSelect = document.getElementById('toAccount');
            
            var options = accounts.map(function(a) {
                return `<option value="${a.id}">${a.name || a.type}</option>`;
            }).join('');
            
            fromSelect.innerHTML = options;
            toSelect.innerHTML = options;

            // Set title
            var titles = { income: '记收入', expense: '记支出', transfer: '转账' };
            document.getElementById('transactionModalTitle').textContent = titles[type];

            // Reset form
            document.getElementById('transactionAmount').value = '';
            document.getElementById('transactionNote').value = '';
            document.getElementById('transactionDate').value = new Date().toISOString().split('T')[0];

            document.getElementById('transactionModal').classList.add('active');
        }

        function openBudgetModal() {
            var currentMonth = new Date().toISOString().slice(0, 7);
            var budget = budgets.find(function(b) {
                return b.period === 'monthly' && b.month === currentMonth;
            });
            
            document.getElementById('totalBudget').value = budget ? budget.amount : '';
            document.getElementById('budgetModal').classList.add('active');
        }

        function openLoanModal() {
            document.getElementById('loanBorrower').value = '';
            document.getElementById('loanAmount').value = '';
            document.getElementById('loanNote').value = '';
            document.getElementById('loanDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('loanModal').classList.add('active');
        }

        function openRepaymentModal() {
            var select = document.getElementById('repaymentLoan');
            select.innerHTML = loans.map(function(l) {
                return `<option value="${l.id}">${l.borrower || '未知'} - ¥${formatMoney(l.amount)}</option>`;
            }).join('');
            
            document.getElementById('repaymentAmount').value = '';
            document.getElementById('repaymentDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('repaymentModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // ==========================================
        // Save Functions
        // ==========================================
        async function saveTransaction() {
            var amount = parseFloat(document.getElementById('transactionAmount').value);
            var fromAccount = document.getElementById('fromAccount').value;
            var toAccount = document.getElementById('toAccount').value;
            var date = document.getElementById('transactionDate').value;
            var note = document.getElementById('transactionNote').value;

            if (!amount || amount <= 0) {
                showToast('请输入有效金额', 'error');
                return;
            }

            if (!selectedCategory && currentTransactionType !== 'transfer') {
                showToast('请选择分类', 'error');
                return;
            }

            if (!fromAccount) {
                showToast('请选择账户', 'error');
                return;
            }

            if (currentTransactionType === 'transfer' && !toAccount) {
                showToast('请选择转入账户', 'error');
                return;
            }

            updateSyncStatus('syncing');

            try {
                var transaction = {
                    type: currentTransactionType,
                    amount: amount,
                    category: selectedCategory || 'transfer',
                    from_account: fromAccount,
                    to_account: currentTransactionType === 'transfer' ? toAccount : null,
                    date: date,
                    note: note,
                    created_at: new Date().toISOString()
                };

                var result = await _sb.from('transactions').insert(transaction).select();
                if (result.error) throw result.error;

                // Update account balances
                await updateAccountBalance(fromAccount, currentTransactionType === 'income' ? amount : -amount);
                if (currentTransactionType === 'transfer') {
                    await updateAccountBalance(toAccount, amount);
                }

                await loadTransactions();
                await loadAccounts();
                renderAll();
                closeModal('transactionModal');
                updateSyncStatus('synced');
                showToast('交易已保存', 'success');
            } catch (error) {
                console.error('Error saving transaction:', error);
                updateSyncStatus('error');
                showToast('保存失败: ' + error.message, 'error');
            }
        }

        async function updateAccountBalance(accountId, delta) {
            var account = accounts.find(function(a) { return a.id === accountId; });
            if (!account) return;

            var newBalance = parseFloat(account.balance || 0) + delta;
            var result = await _sb.from('accounts')
                .update({ balance: newBalance, updated_at: new Date().toISOString() })
                .eq('id', accountId);
            
            if (result.error) throw result.error;
        }

        async function saveBudget() {
            var amount = parseFloat(document.getElementById('totalBudget').value);
            var period = document.getElementById('budgetPeriod').value;
            var currentMonth = new Date().toISOString().slice(0, 7);

            if (!amount || amount <= 0) {
                showToast('请输入有效预算金额', 'error');
                return;
            }

            updateSyncStatus('syncing');

            try {
                var existing = budgets.find(function(b) {
                    return b.period === period && b.month === currentMonth;
                });

                var budget = {
                    amount: amount,
                    period: period,
                    month: currentMonth,
                    updated_at: new Date().toISOString()
                };

                var result;
                if (existing) {
                    result = await _sb.from('budgets').update(budget).eq('id', existing.id);
                } else {
                    budget.created_at = new Date().toISOString();
                    result = await _sb.from('budgets').insert(budget);
                }

                if (result.error) throw result.error;

                await loadBudgets();
                renderBudget();
                closeModal('budgetModal');
                updateSyncStatus('synced');
                showToast('预算已保存', 'success');
            } catch (error) {
                console.error('Error saving budget:', error);
                updateSyncStatus('error');
                showToast('保存失败: ' + error.message, 'error');
            }
        }

        async function saveLoan() {
            var borrower = document.getElementById('loanBorrower').value.trim();
            var amount = parseFloat(document.getElementById('loanAmount').value);
            var date = document.getElementById('loanDate').value;
            var rate = parseFloat(document.getElementById('loanRate').value);
            var note = document.getElementById('loanNote').value.trim();

            if (!borrower) {
                showToast('请输入借款人姓名', 'error');
                return;
            }

            if (!amount || amount <= 0) {
                showToast('请输入有效金额', 'error');
                return;
            }

            updateSyncStatus('syncing');

            try {
                var loan = {
                    borrower: borrower,
                    amount: amount,
                    date: date,
                    interest_rate: rate || 17.64,
                    note: note,
                    status: 'active',
                    created_at: new Date().toISOString()
                };

                var result = await _sb.from('loans').insert(loan).select();
                if (result.error) throw result.error;

                await loadLoans();
                renderLoans();
                closeModal('loanModal');
                updateSyncStatus('synced');
                showToast('借款已记录', 'success');
            } catch (error) {
                console.error('Error saving loan:', error);
                updateSyncStatus('error');
                showToast('保存失败: ' + error.message, 'error');
            }
        }

        async function saveRepayment() {
            var loanId = document.getElementById('repaymentLoan').value;
            var amount = parseFloat(document.getElementById('repaymentAmount').value);
            var date = document.getElementById('repaymentDate').value;
            var type = document.getElementById('repaymentType').value;

            if (!loanId) {
                showToast('请选择借款', 'error');
                return;
            }

            if (!amount || amount <= 0) {
                showToast('请输入有效金额', 'error');
                return;
            }

            updateSyncStatus('syncing');

            try {
                var repayment = {
                    loan_id: loanId,
                    amount: amount,
                    date: date,
                    type: type,
                    created_at: new Date().toISOString()
                };

                var result = await _sb.from('repayments').insert(repayment);
                if (result.error) throw result.error;

                await loadRepayments();
                renderLoans();
                closeModal('repaymentModal');
                updateSyncStatus('synced');
                showToast('还款已记录', 'success');
            } catch (error) {
                console.error('Error saving repayment:', error);
                updateSyncStatus('error');
                showToast('保存失败: ' + error.message, 'error');
            }
        }

        async function deleteTransaction(id) {
            if (!confirm('确定要删除这条记录吗？')) return;

            updateSyncStatus('syncing');

            try {
                var transaction = transactions.find(function(t) { return t.id === id; });
                if (transaction) {
                    // Revert account balance
                    await updateAccountBalance(transaction.from_account, 
                        transaction.type === 'income' ? -transaction.amount : transaction.amount);
                    if (transaction.type === 'transfer' && transaction.to_account) {
                        await updateAccountBalance(transaction.to_account, -transaction.amount);
                    }
                }

                var result = await _sb.from('transactions').delete().eq('id', id);
                if (result.error) throw result.error;

                await loadTransactions();
                await loadAccounts();
                renderAll();
                updateSyncStatus('synced');
                showToast('记录已删除', 'success');
            } catch (error) {
                console.error('Error deleting transaction:', error);
                updateSyncStatus('error');
                showToast('删除失败: ' + error.message, 'error');
            }
        }

        // ==========================================
        // Export Functions
        // ==========================================
        function exportToExcel() {
            if (transactions.length === 0) {
                showToast('没有数据可导出', 'warning');
                return;
            }

            var data = transactions.map(function(t) {
                var cat = getCategory(t.category, t.type);
                var fromAcc = accounts.find(function(a) { return a.id === t.from_account; });
                return {
                    '日期': t.date,
                    '类型': t.type === 'income' ? '收入' : t.type === 'expense' ? '支出' : '转账',
                    '分类': cat.name,
                    '账户': fromAcc ? (fromAcc.name || fromAcc.type) : '',
                    '金额': parseFloat(t.amount) || 0,
                    '备注': t.note || ''
                };
            });

            var ws = XLSX.utils.json_to_sheet(data);
            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '收支明细');
            
            var filename = '个人记账_' + new Date().toISOString().slice(0, 10) + '.xlsx';
            XLSX.writeFile(wb, filename);
            
            showToast('Excel已导出', 'success');
        }

        // Close modals on overlay click
        document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                }
            });
        });
    </script>
