<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人记账</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ========== CSS Reset & Variables ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0c0c0e;
  --card: #16161a;
  --card-hover: #1c1c22;
  --border: #24242a;
  --border-hover: #3a3a44;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --secondary: #8b5cf6;
  --success: #10b981;
  --danger: #f43f5e;
  --warning: #f59e0b;
  --text: #e4e4e7;
  --text-secondary: #71717a;
  --text-muted: #52525b;
  --radius: 14px;
  --radius-sm: 10px;
  --radius-xs: 7px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.5;
}
.mono { font-family: 'JetBrains Mono', monospace; }

/* ========== Background Blobs ========== */
.bg-blobs {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.blob {
  position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.15;
}
.blob-1 {
  width: 600px; height: 600px; top: -200px; right: -150px;
  background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
}
.blob-2 {
  width: 500px; height: 500px; bottom: -100px; left: -100px;
  background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
}
.blob-3 {
  width: 300px; height: 300px; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
  opacity: 0.05;
}

/* ========== Layout ========== */
.app-container {
  position: relative; z-index: 1;
  max-width: 520px; margin: 0 auto;
  padding: 20px 16px 100px;
}

/* ========== Header ========== */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0 20px; animation: fadeUp 0.5s ease both;
}
.header-title {
  font-size: 1.35rem; font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.month-nav {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 14px;
}
.month-nav button {
  background: none; border: none; color: var(--text-secondary);
  cursor: pointer; font-size: 14px; padding: 2px 4px;
  transition: color var(--transition);
}
.month-nav button:hover { color: var(--primary); }
.month-nav span {
  font-size: 0.82rem; font-weight: 600; color: var(--text);
  min-width: 80px; text-align: center;
}

/* ========== Cards ========== */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
  transition: border-color var(--transition), background var(--transition);
}
.card:hover { border-color: var(--border-hover); }

/* ========== Summary Cards ========== */
.summary-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
  margin-bottom: 16px;
}
.summary-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 12px;
  text-align: center; transition: border-color var(--transition);
  animation: fadeUp 0.5s ease both;
}
.summary-card:nth-child(1) { animation-delay: 0.05s; }
.summary-card:nth-child(2) { animation-delay: 0.13s; }
.summary-card:nth-child(3) { animation-delay: 0.21s; }
.summary-card:hover { border-color: var(--border-hover); }
.summary-label {
  font-size: 0.7rem; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 6px; font-weight: 500;
}
.summary-amount {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.05rem; font-weight: 700;
}
.summary-amount.income { color: var(--success); }
.summary-amount.expense { color: var(--danger); }
.summary-amount.balance { color: var(--primary); }

/* ========== Quick Actions ========== */
.quick-actions {
  display: flex; gap: 8px; margin-bottom: 16px;
  animation: fadeUp 0.5s ease 0.1s both;
}
.btn-add {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 16px; border: none; border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600;
  cursor: pointer; transition: all var(--transition);
  color: #fff;
}
.btn-add.primary {
  background: linear-gradient(135deg, var(--primary), #6366f1);
  box-shadow: 0 4px 16px rgba(59,130,246,0.25);
}
.btn-add.primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(59,130,246,0.35);
}
.btn-add.secondary {
  background: var(--card); border: 1px solid var(--border);
  color: var(--text-secondary);
}
.btn-add.secondary:hover {
  border-color: var(--border-hover); color: var(--text);
  transform: translateY(-1px);
}
.btn-add .icon { font-size: 1.1rem; }

/* ========== Section ========== */
.section {
  margin-bottom: 16px;
  animation: fadeUp 0.5s ease both;
}
.section:nth-child(5) { animation-delay: 0.15s; }
.section:nth-child(6) { animation-delay: 0.23s; }
.section:nth-child(7) { animation-delay: 0.31s; }
.section:nth-child(8) { animation-delay: 0.39s; }
.section:nth-child(9) { animation-delay: 0.47s; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.section-title {
  font-size: 0.9rem; font-weight: 600; color: var(--text);
}
.section-action {
  font-size: 0.75rem; color: var(--primary); cursor: pointer;
  background: none; border: none; font-family: 'Inter', sans-serif;
  font-weight: 500; transition: color var(--transition);
}
.section-action:hover { color: var(--primary-hover); }

/* ========== Accounts ========== */
.accounts-scroll {
  display: flex; gap: 8px; overflow-x: auto;
  padding-bottom: 4px; scrollbar-width: none;
}
.accounts-scroll::-webkit-scrollbar { display: none; }
.account-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 20px;
  background: var(--card); border: 1px solid var(--border);
  white-space: nowrap; cursor: default;
  transition: border-color var(--transition);
  font-size: 0.78rem; font-weight: 500;
}
.account-chip:hover { border-color: var(--border-hover); }
.account-chip .acc-icon { font-size: 1rem; }
.account-chip .acc-balance {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem; color: var(--text-secondary);
  margin-left: 2px;
}

/* ========== Charts ========== */
.charts-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.chart-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px;
  transition: border-color var(--transition);
}
.chart-card:hover { border-color: var(--border-hover); }
.chart-title {
  font-size: 0.75rem; font-weight: 600; color: var(--text-secondary);
  margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.3px;
}
.chart-wrap { position: relative; width: 100%; }
.chart-wrap canvas { width: 100% !important; }
.chart-empty {
  display: flex; align-items: center; justify-content: center;
  height: 140px; color: var(--text-muted); font-size: 0.8rem;
}

/* ========== Transaction List ========== */
.tx-list { display: flex; flex-direction: column; gap: 6px; }
.tx-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--card); border: 1px solid var(--border);
  transition: border-color var(--transition);
  cursor: default;
}
.tx-item:hover { border-color: var(--border-hover); }
.tx-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; flex-shrink: 0;
}
.tx-info { flex: 1; min-width: 0; }
.tx-cat {
  font-size: 0.82rem; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tx-desc {
  font-size: 0.7rem; color: var(--text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 1px;
}
.tx-right { text-align: right; flex-shrink: 0; }
.tx-amount {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.88rem; font-weight: 700;
}
.tx-amount.income { color: var(--success); }
.tx-amount.expense { color: var(--danger); }
.tx-amount.transfer { color: var(--primary); }
.tx-date {
  font-size: 0.65rem; color: var(--text-muted); margin-top: 1px;
}
.tx-del {
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; font-size: 0.85rem; padding: 4px;
  border-radius: 6px; transition: all var(--transition);
  flex-shrink: 0; opacity: 0;
}
.tx-item:hover .tx-del { opacity: 1; }
.tx-del:hover { color: var(--danger); background: rgba(244,63,94,0.1); }
.tx-empty {
  text-align: center; padding: 30px; color: var(--text-muted);
  font-size: 0.82rem;
}

/* ========== Budget ========== */
.budget-list { display: flex; flex-direction: column; gap: 8px; }
.budget-item {
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--card); border: 1px solid var(--border);
  transition: border-color var(--transition);
}
.budget-item:hover { border-color: var(--border-hover); }
.budget-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.budget-name {
  font-size: 0.82rem; font-weight: 600;
}
.budget-vals {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem; color: var(--text-secondary);
}
.budget-vals .used { color: var(--text); font-weight: 600; }
.progress-bar {
  height: 6px; background: var(--border); border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 3px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.progress-fill.safe { background: var(--success); }
.progress-fill.warn { background: var(--warning); }
.progress-fill.danger { background: var(--danger); }
.budget-empty {
  text-align: center; padding: 20px; color: var(--text-muted);
  font-size: 0.82rem;
}

/* ========== Loan ========== */
.loan-list { display: flex; flex-direction: column; gap: 8px; }
.loan-item {
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--card); border: 1px solid var(--border);
  transition: border-color var(--transition);
}
.loan-item:hover { border-color: var(--border-hover); }
.loan-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 4px;
}
.loan-remark { font-size: 0.82rem; font-weight: 600; }
.loan-amount {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.88rem; font-weight: 700; color: var(--warning);
}
.loan-meta {
  font-size: 0.7rem; color: var(--text-secondary);
  display: flex; gap: 12px;
}
.loan-actions {
  display: flex; gap: 6px; margin-top: 8px;
}
.loan-btn {
  padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: none; color: var(--text-secondary); font-size: 0.72rem;
  font-family: 'Inter', sans-serif; font-weight: 500;
  cursor: pointer; transition: all var(--transition);
}
.loan-btn:hover { border-color: var(--border-hover); color: var(--text); }
.loan-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.loan-empty {
  text-align: center; padding: 20px; color: var(--text-muted);
  font-size: 0.82rem;
}

/* ========== Modal ========== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  backdrop-filter: blur(4px); z-index: 100;
  display: none; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.2s ease;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px 20px 0 0; width: 100%; max-width: 520px;
  max-height: 85vh; overflow-y: auto; padding: 0;
  animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-handle {
  width: 36px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 10px auto 0;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px;
}
.modal-title { font-size: 1rem; font-weight: 700; }
.modal-close {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--border); border: none; color: var(--text-secondary);
  font-size: 1rem; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: all var(--transition);
}
.modal-close:hover { background: var(--danger); color: #fff; }
.modal-body { padding: 0 20px 24px; }

/* ========== Form Elements ========== */
.type-tabs {
  display: flex; gap: 6px; margin-bottom: 16px;
  background: var(--bg); border-radius: var(--radius-sm); padding: 4px;
}
.type-tab {
  flex: 1; padding: 8px; border: none; border-radius: var(--radius-xs);
  background: transparent; color: var(--text-secondary);
  font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600;
  cursor: pointer; transition: all var(--transition);
}
.type-tab.active.expense-tab {
  background: rgba(244,63,94,0.15); color: var(--danger);
}
.type-tab.active.income-tab {
  background: rgba(16,185,129,0.15); color: var(--success);
}
.type-tab.active.transfer-tab {
  background: rgba(59,130,246,0.15); color: var(--primary);
}

.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 0.75rem; font-weight: 600;
  color: var(--text-secondary); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.form-input {
  width: 100%; padding: 10px 14px; border-radius: var(--radius-xs);
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-family: 'Inter', sans-serif;
  font-size: 0.88rem; transition: border-color var(--transition);
  outline: none;
}
.form-input:focus { border-color: var(--primary); }
.form-input.mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.4rem; font-weight: 700;
  text-align: center; letter-spacing: 1px;
}
.form-input::placeholder { color: var(--text-muted); }

/* Category Grid */
.cat-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
}
.cat-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 4px; border-radius: var(--radius-sm);
  border: 1px solid transparent; cursor: pointer;
  transition: all var(--transition); background: none;
  font-family: 'Inter', sans-serif;
}
.cat-item:hover { background: rgba(255,255,255,0.03); }
.cat-item.selected {
  border-color: var(--primary);
  background: rgba(59,130,246,0.08);
}
.cat-item .cat-icon { font-size: 1.3rem; }
.cat-item .cat-name {
  font-size: 0.62rem; color: var(--text-secondary);
  font-weight: 500; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 100%;
}
.cat-item.selected .cat-name { color: var(--primary); }

/* Account Select */
.account-select-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
}
.acc-select-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 4px; border-radius: var(--radius-sm);
  border: 1px solid transparent; cursor: pointer;
  transition: all var(--transition); background: none;
  font-family: 'Inter', sans-serif;
}
.acc-select-item:hover { background: rgba(255,255,255,0.03); }
.acc-select-item.selected {
  border-color: var(--primary);
  background: rgba(59,130,246,0.08);
}
.acc-select-item .acc-icon { font-size: 1.2rem; }
.acc-select-item .acc-name {
  font-size: 0.68rem; color: var(--text-secondary);
  font-weight: 500;
}
.acc-select-item.selected .acc-name { color: var(--primary); }

.btn-submit {
  width: 100%; padding: 13px; border: none; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--primary), #6366f1);
  color: #fff; font-family: 'Inter', sans-serif;
  font-size: 0.9rem; font-weight: 700; cursor: pointer;
  transition: all var(--transition);
  box-shadow: 0 4px 16px rgba(59,130,246,0.25);
  margin-top: 6px;
}
.btn-submit:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(59,130,246,0.35);
}
.btn-submit:active { transform: translateY(0); }
.btn-submit:disabled {
  opacity: 0.5; cursor: not-allowed; transform: none;
  box-shadow: none;
}

/* ========== Budget Modal ========== */
.budget-form-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}

/* ========== Loan Modal ========== */
.loan-form-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}

/* ========== Toast ========== */
.toast-container {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 200; display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  padding: 10px 20px; border-radius: var(--radius-sm);
  font-size: 0.82rem; font-weight: 500;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards;
  pointer-events: auto; white-space: nowrap;
}
.toast.success { background: rgba(16,185,129,0.9); color: #fff; }
.toast.error { background: rgba(244,63,94,0.9); color: #fff; }
.toast.info { background: rgba(59,130,246,0.9); color: #fff; }

/* ========== Animations ========== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes toastOut {
  from { opacity: 1; }
  to { opacity: 0; }
}

/* ========== Scrollbar ========== */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ========== Responsive ========== */
@media (max-width: 540px) {
  .app-container { padding: 16px 12px 100px; }
  .summary-amount { font-size: 0.92rem; }
  .cat-grid { grid-template-columns: repeat(4, 1fr); }
}

/* ========== Export Button ========== */
.btn-export {
  padding: 5px 12px; border-radius: 6px;
  border: 1px solid var(--border); background: none;
  color: var(--text-secondary); font-size: 0.72rem;
  font-family: 'Inter', sans-serif; font-weight: 500;
  cursor: pointer; transition: all var(--transition);
}
.btn-export:hover { border-color: var(--border-hover); color: var(--text); }

/* ========== Transfer fields ========== */
.transfer-fields { display: flex; flex-direction: column; gap: 10px; }
.transfer-arrow {
  text-align: center; color: var(--primary); font-size: 1.2rem;
  padding: 4px 0;
}

/* ========== Loading ========== */
.loading-spinner {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid var(--border); border-top-color: var(--primary);
  border-radius: 50%; animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ========== Subtle grid pattern ========== */
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 60px 60px;
}
</style>
</head>
<body>

<!-- Background Effects -->
<div class="bg-grid"></div>
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Main App -->
<div class="app-container">

  <!-- Header -->
  <div class="header">
    <div class="header-title">&#x1F4B0; 个人记账</div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">&#9664;</button>
      <span id="monthLabel">2025年1月</span>
      <button onclick="changeMonth(1)">&#9654;</button>
    </div>
  </div>

  <!-- Summary Cards -->
  <div class="summary-row">
    <div class="summary-card">
      <div class="summary-label">本月收入</div>
      <div class="summary-amount income mono" id="totalIncome">¥0.00</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">本月支出</div>
      <div class="summary-amount expense mono" id="totalExpense">¥0.00</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">本月结余</div>
      <div class="summary-amount balance mono" id="totalBalance">¥0.00</div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="quick-actions">

// ============================================================
//  数据加载
// ============================================================
async function loadData() {
  console.log('[Data] Loading all data...');
  try {
    var results = await Promise.all([
      _sb.from('accounts').select('*').eq('is_active', true).order('sort_order'),
      _sb.from('categories').select('*').eq('is_active', true).order('sort_order'),
      _sb.from('transactions').select('*').order('date', { ascending: false }).order('created_at', { ascending: false }),
      _sb.from('budgets').select('*').eq('is_active', true),
      _sb.from('loans').select('*').order('date', { ascending: false }),
      _sb.from('repayments').select('*').order('date', { ascending: false })
    ]);

    allAccounts = results[0].data || [];
    allCategories = results[1].data || [];
    allTransactions = results[2].data || [];
    allBudgets = results[3].data || [];
    allLoans = results[4].data || [];

    console.error('[Data] Load error:', e);

}

  { name: '兼职', type: 'income', icon: '💼', color: '#8b5cf6', sort_order: 14 },
  { name: '其他收入', type: 'income', icon: '💵', color: '#71717a', sort_order: 15 }

var defaultAccounts = [
  { name: '现金', type: 'cash', icon: '💵', color: '#10b981', balance: 0, sort_order: 1 },
  { name: '银行卡', type: 'bank', icon: '💳', color: '#3b82f6', balance: 0, sort_order: 2 },
  { name: '支付宝', type: 'ewallet', icon: '🔵', color: '#3b82f6', balance: 0, sort_order: 3 },
  { name: '微信', type: 'ewallet', icon: '🟢', color: '#10b981', balance: 0, sort_order: 4 },

// 演示数据（Supabase 不可用时）
function loadDemoData() {

    return { id: 'demo_cat_' + i, name: c.name, type: c.type, icon: c.icon, color: c.color, sort_order: c.sort_order, is_active: true };

  allBudgets = [];

// ============================================================
//  渲染
// ============================================================
function renderAll() {
  updateMonthLabel();
  renderSummary();
  renderAccounts();
  renderTransactions();
  renderCharts();
  renderBudgets();
  renderLoans();
}

function updateMonthLabel() {
  document.getElementById('monthLabel').textContent = currentYear + '年' + currentMonth + '月';
}

// ---------- Summary ----------
function renderSummary() {
  var monthTx = getMonthTransactions();
  var income = 0, expense = 0;
  monthTx.forEach(function(tx) {
    if (tx.type === 'income') income += parseFloat(tx.amount) || 0;
    else if (tx.type === 'expense') expense += parseFloat(tx.amount) || 0;
  });
  var balance = income - expense;
  document.getElementById('totalIncome').textContent = '¥' + formatNum(income);
  document.getElementById('totalExpense').textContent = '¥' + formatNum(expense);
  var balEl = document.getElementById('totalBalance');
  balEl.textContent = (balance >= 0 ? '¥' : '-¥') + formatNum(Math.abs(balance));
  balEl.className = 'summary-amount balance mono';
  if (balance < 0) balEl.style.color = 'var(--danger)';
  else balEl.style.color = '';
}

function getMonthTransactions() {
  var prefix = currentYear + '-' + String(currentMonth).padStart(2, '0');
  return allTransactions.filter(function(tx) {
    return tx.date && tx.date.startsWith(prefix);
  });
}

// ---------- Accounts ----------
function renderAccounts() {
  var container = document.getElementById('accountsList');
  if (allAccounts.length === 0) {
    container.innerHTML = '<div class="account-chip" style="color:var(--text-muted);">暂无账户</div>';
    return;
  }
  var html = '';
  allAccounts.forEach(function(acc) {
    var bal = acc.balance || 0;
    html += '<div class="account-chip">'
      + '<span class="acc-icon">' + escHtml(acc.icon || '') + '</span>'
      + '<span>' + escHtml(acc.name) + '</span>'
      + '<span class="acc-balance">¥' + formatNum(bal) + '</span>'
      + '</div>';
  });
  container.innerHTML = html;
}

// ---------- Transactions ----------
function renderTransactions() {
  var container = document.getElementById('txList');
  var monthTx = getMonthTransactions();

  if (monthTx.length === 0) {
    container.innerHTML = '<div class="tx-empty">本月暂无交易记录</div>';
    return;
  }

  // 只显示最近 50 条
  var show = monthTx.slice(0, 50);
  var html = '';
  show.forEach(function(tx) {
    var cat = findCategory(tx.category_id);
    var acc = findAccount(tx.account_id);
    var icon = cat ? cat.icon : '📦';
    var catName = cat ? cat.name : (tx.type === 'transfer' ? '转账' : '未知');
    var bgColor = cat ? cat.color + '18' : '#24242a';
    var typeClass = tx.type || 'expense';
    var sign = typeClass === 'income' ? '+' : (typeClass === 'transfer' ? '' : '-');
    var amt = parseFloat(tx.amount) || 0;

    html += '<div class="tx-item">'
      + '<div class="tx-icon" style="background:' + bgColor + '">' + icon + '</div>'
      + '<div class="tx-info">'
      + '<div class="tx-cat">' + escHtml(catName) + (acc ? ' · ' + escHtml(acc.name) : '') + '</div>'
      + '<div class="tx-desc">' + escHtml(tx.description || tx.remark || '') + '</div>'
      + '</div>'
      + '<div class="tx-right">'
      + '<div class="tx-amount ' + typeClass + '">' + sign + '¥' + formatNum(amt) + '</div>'
      + '<div class="tx-date">' + (tx.date || '').substring(5) + '</div>'
      + '</div>'
      + '<button class="tx-del" onclick="deleteTransaction(\'' + tx.id + '\')" title="删除">&times;</button>'
      + '</div>';
  });
  container.innerHTML = html;
}

// ---------- Charts ----------
function renderCharts() {
  renderPieChart();
  renderBarChart();
}

function renderPieChart() {
  var wrap = document.getElementById('pieChartWrap');
  var monthTx = getMonthTransactions().filter(function(tx) { return tx.type === 'expense'; });

  if (monthTx.length === 0) {
    wrap.innerHTML = '<div class="chart-empty">暂无数据</div>';
    if (pieChart) { pieChart.destroy(); pieChart = null; }
    return;
  }

  // 按分类汇总
  var catMap = {};
  monthTx.forEach(function(tx) {
    var cat = findCategory(tx.category_id);
    var key = cat ? cat.id : 'other';
    if (!catMap[key]) catMap[key] = { name: cat ? cat.name : '其他', color: cat ? cat.color : '#71717a', total: 0 };
    catMap[key].total += parseFloat(tx.amount) || 0;
  });

  var labels = [], data = [], colors = [];
  Object.values(catMap).sort(function(a, b) { return b.total - a.total; }).forEach(function(item) {
    labels.push(item.name);
    data.push(item.total);
    colors.push(item.color);
  });

  wrap.innerHTML = '<canvas id="pieCanvas" height="150"></canvas>';
  var ctx = document.getElementById('pieCanvas').getContext('2d');

  if (pieChart) pieChart.destroy();
  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{
        data: data,
        backgroundColor: colors,
        borderWidth: 0,
        hoverOffset: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '65%',
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c1c22',
          titleColor: '#e4e4e7',
          bodyColor: '#e4e4e7',
          borderColor: '#24242a',
          borderWidth: 1,
          padding: 10,
          cornerRadius: 8,
          callbacks: {
            label: function(ctx) {
              return ctx.label + ': ¥' + formatNum(ctx.raw);
            }
          }
        }
      }
    }
  });
}

function renderBarChart() {
  var wrap = document.getElementById('barChartWrap');

  // 获取最近 6 个月的数据
  var labels = [], incomeData = [], expenseData = [];
  for (var i = 5; i >= 0; i--) {
    var d = new Date(currentYear, currentMonth - 1 - i, 1);
    var y = d.getFullYear(), m = d.getMonth() + 1;
    var prefix = y + '-' + String(m).padStart(2, '0');
    labels.push(m + '月');

    var inc = 0, exp = 0;
    allTransactions.forEach(function(tx) {
      if (tx.date && tx.date.startsWith(prefix)) {
        if (tx.type === 'income') inc += parseFloat(tx.amount) || 0;
        else if (tx.type === 'expense') exp += parseFloat(tx.amount) || 0;
      }
    });
    incomeData.push(inc);
    expenseData.push(exp);
  }

  // 检查是否全部为 0
  var hasData = incomeData.some(function(v) { return v > 0; }) || expenseData.some(function(v) { return v > 0; });
  if (!hasData) {
    wrap.innerHTML = '<div class="chart-empty">暂无数据</div>';
    if (barChart) { barChart.destroy(); barChart = null; }
    return;
  }

  wrap.innerHTML = '<canvas id="barCanvas" height="150"></canvas>';
  var ctx = document.getElementById('barCanvas').getContext('2d');

  if (barChart) barChart.destroy();
  barChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        {
          label: '收入',
          data: incomeData,
          backgroundColor: 'rgba(16,185,129,0.7)',
          borderRadius: 4,
          barPercentage: 0.6,
          categoryPercentage: 0.7
        },
        {
          label: '支出',
          data: expenseData,
          backgroundColor: 'rgba(244,63,94,0.7)',
          borderRadius: 4,
          barPercentage: 0.6,
          categoryPercentage: 0.7
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          grid: { display: false },
          ticks: { color: '#71717a', font: { size: 10 } }
        },
        y: {
          grid: { color: '#24242a' },
          ticks: {
            color: '#71717a',
            font: { size: 10 },
            callback: function(v) { return v >= 1000 ? (v / 1000) + 'k' : v; }
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c1c22',
          titleColor: '#e4e4e7',
          bodyColor: '#e4e4e7',
          borderColor: '#24242a',
          borderWidth: 1,
          padding: 10,
          cornerRadius: 8,
          callbacks: {
            label: function(ctx) {
              return ctx.dataset.label + ': ¥' + formatNum(ctx.raw);
            }
          }
        }
      }
    }
  });
}

// ---------- Budgets ----------
function renderBudgets() {
  var container = document.getElementById('budgetList');
  if (allBudgets.length === 0) {
    container.innerHTML = '<div class="budget-empty">暂无预算，点击上方添加</div>';
    return;
  }

  var monthTx = getMonthTransactions().filter(function(tx) { return tx.type === 'expense'; });
  var html = '';

  allBudgets.forEach(function(budget) {
    // 计算该分类本月支出
    var used = 0;
    if (budget.category_id) {
      monthTx.forEach(function(tx) {
        if (tx.category_id === budget.category_id) {
          used += parseFloat(tx.amount) || 0;
        }
      });
    } else {
      monthTx.forEach(function(tx) { used += parseFloat(tx.amount) || 0; });
    }

    var total = parseFloat(budget.amount) || 0;
    var pct = total > 0 ? Math.min((used / total) * 100, 100) : 0;
    var threshold = parseFloat(budget.alert_threshold) || 80;
    var cls = pct >= 100 ? 'danger' : (pct >= threshold ? 'warn' : 'safe');
    var cat = findCategory(budget.category_id);
    var name = budget.name || (cat ? cat.name : '总预算');

    html += '<div class="budget-item">'
      + '<div class="budget-top">'
      + '<span class="budget-name">' + escHtml(name) + '</span>'
      + '<span class="budget-vals"><span class="used">¥' + formatNum(used) + '</span> / ¥' + formatNum(total) + '</span>'
      + '</div>'
      + '<div class="progress-bar"><div class="progress-fill ' + cls + '" style="width:' + pct + '%"></div></div>'
      + '</div>';
  });
  container.innerHTML = html;
}

// ---------- Loans ----------
function renderLoans() {
  var container = document.getElementById('loanList');
  if (allLoans.length === 0) {
    container.innerHTML = '<div class="loan-empty">暂无贷款记录</div>';
    return;
  }

  var html = '';
  allLoans.forEach(function(loan) {
    var totalRepay = 0;
    allRepayments.forEach(function(r) {
      if (r.loan_id === loan.id) totalRepay += parseFloat(r.amount) || 0;
    });
    var remaining = (parseFloat(loan.amount) || 0) - totalRepay;
    var rate = loan.interest_rate ? parseFloat(loan.interest_rate) : 0;

    html += '<div class="loan-item">'
      + '<div class="loan-top">'
      + '<span class="loan-remark">' + escHtml(loan.remark || '借款') + '</span>'
      + '<span class="loan-amount">¥' + formatNum(remaining) + '</span>'
      + '</div>'
      + '<div class="loan-meta">'
      + '<span>借款 ¥' + formatNum(parseFloat(loan.amount) || 0) + '</span>'
      + '<span>已还 ¥' + formatNum(totalRepay) + '</span>'
      + (rate > 0 ? '<span>利率 ' + rate + '%</span>' : '')
      + '<span>' + (loan.date || '') + '</span>'
      + '</div>'
      + '<div class="loan-actions">'
      + '<button class="loan-btn" onclick="openRepayModal(\'' + loan.id + '\')">还款</button>'
      + '<button class="loan-btn danger" onclick="deleteLoan(\'' + loan.id + '\')">删除</button>'
      + '</div>'
      + '</div>';
  });
  container.innerHTML = html;
}

// ============================================================
//  月份切换
// ============================================================
function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  renderAll();
}

// ============================================================
//  添加交易 Modal
// ============================================================
function openAddModal(type) {
  selectedType = type || 'expense';
  selectedCatId = null;
  selectedAccId = null;
  selectedFromAccId = null;
  selectedToAccId = null;

  // 设置日期为今天
  var today = new Date().toISOString().split('T')[0];
  document.getElementById('txDate').value = today;
  document.getElementById('txAmount').value = '';
  document.getElementById('txDesc').value = '';

  switchType(selectedType);
  document.getElementById('addModal').classList.add('active');
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('active');
}

function switchType(type) {
  selectedType = type;
  selectedCatId = null;
  selectedAccId = null;
  selectedFromAccId = null;
  selectedToAccId = null;

  // 更新 tab 样式
  document.getElementById('tabExpense').classList.toggle('active', type === 'expense');
  document.getElementById('tabIncome').classList.toggle('active', type === 'income');
  document.getElementById('tabTransfer').classList.toggle('active', type === 'transfer');

  // 显示/隐藏分类和账户
  var isTransfer = type === 'transfer';
  document.getElementById('catGroup').style.display = isTransfer ? 'none' : '';
  document.getElementById('accGroup').style.display = isTransfer ? 'none' : '';
  document.getElementById('transferGroup').style.display = isTransfer ? '' : 'none';

  // 渲染分类网格
  if (!isTransfer) {
    renderCatGrid();
    renderAccGrid();
  } else {
    renderTransferGrids();
  }
}

function renderCatGrid() {
  var container = document.getElementById('catGrid');
  var cats = allCategories.filter(function(c) { return c.type === selectedType; });
  if (cats.length === 0) {
    container.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:16px;font-size:0.8rem;">暂无分类</div>';
    return;
  }
  var html = '';
  cats.forEach(function(cat) {
    html += '<button class="cat-item" data-id="' + cat.id + '" onclick="selectCat(\'' + cat.id + '\')">'
      + '<span class="cat-icon">' + escHtml(cat.icon || '') + '</span>'
      + '<span class="cat-name">' + escHtml(cat.name) + '</span>'
      + '</button>';
  });
  container.innerHTML = html;
}

function selectCat(id) {
  selectedCatId = id;
  var items = document.querySelectorAll('#catGrid .cat-item');
  items.forEach(function(el) {
    el.classList.toggle('selected', el.getAttribute('data-id') === id);

}

function renderAccGrid() {

function selectAcc(id) {

    el.classList.toggle('selected', el.getAttribute('data-id') === id);

}

function renderTransferGrids() {
  var fromContainer = document.getElementById('fromAccGrid');
  var toContainer = document.getElementById('toAccGrid');
  if (allAccounts.length === 0) {
    fromContainer.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:16px;font-size:0.8rem;">暂无账户</div>';

  items.forEach(function(el) {

function selectToAcc(id) {

// ============================================================
//  提交交易
// ============================================================
async function submitTransaction() {
  var amount = parseFloat(document.getElementById('txAmount').value);
  var date = document.getElementById('txDate').value;
  var desc = document.getElementById('txDesc').value.trim();

  // 验证
  if (!amount || amount <= 0) { showToast('请输入有效金额', 'error'); return; }
  if (!date) { showToast('请选择日期', 'error'); return; }

  if (selectedType === 'transfer') {
    if (!selectedFromAccId || !selectedToAccId) { showToast('请选择转出和转入账户', 'error'); return; }
    if (selectedFromAccId === selectedToAccId) { showToast('转出和转入账户不能相同', 'error'); return; }
  } else {
    if (!selectedCatId) { showToast('请选择分类', 'error'); return; }
    if (!selectedAccId) { showToast('请选择账户', 'error'); return; }
  }

  var btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.textContent = '提交中...';

  try {
    var row = {
      date: date,
      type: selectedType,
      amount: amount,
      description: desc,
      remark: desc
    };

    if (selectedType === 'transfer') {
      row.category_id = null;
      row.account_id = selectedFromAccId;
      row.to_account_id = selectedToAccId;
    } else {
      row.category_id = selectedCatId;
      row.account_id = selectedAccId;
      row.to_account_id = null;
    }

    if (_sb) {
      var res = await _sb.from('transactions').insert(row).select();
      if (res.error) throw res.error;
      console.log('[TX] Inserted:', res.data);
      // 添加到本地缓存
      if (res.data && res.data.length > 0) {
        allTransactions.unshift(res.data[0]);
      }
    } else {
      // 演示模式
      row.id = 'demo_' + Date.now();
      allTransactions.unshift(row);
    }

    showToast('记账成功！', 'success');
    closeAddModal();
    renderAll();
  } catch (e) {
    console.error('[TX] Submit error:', e);
    showToast('记账失败: ' + (e.message || '未知错误'), 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '确认记账';
  }
}

// ============================================================
//  删除交易
// ============================================================
async function deleteTransaction(id) {
  if (!confirm('确定删除这条记录吗？')) return;

  try {
    if (_sb) {
      var res = await _sb.from('transactions').delete().eq('id', id);
      if (res.error) throw res.error;
    }
    allTransactions = allTransactions.filter(function(tx) { return tx.id !== id; });
    showToast('已删除', 'info');
    renderAll();
  } catch (e) {
    console.error('[TX] Delete error:', e);
    showToast('删除失败', 'error');
  }
}

async function submitBudget() {

  var amount = parseFloat(document.getElementById('budgetAmount').value);
  var catId = document.getElementById('budgetCat').value || null;
  var period = document.getElementById('budgetPeriod').value;

  try {
    var row = {
      name: name,
      type: 'expense',
      category_id: catId,
      amount: amount,
      period: period,
      alert_threshold: alertThreshold,
      is_active: true
    };

    if (_sb) {
      var res = await _sb.from('budgets').insert(row).select();
      if (res.error) throw res.error;
      if (res.data && res.data.length > 0) allBudgets.push(res.data[0]);
    } else {
      row.id = 'demo_budget_' + Date.now();
      allBudgets.push(row);

    showToast('预算已设置', 'success');
    closeBudgetModal();
    renderBudgets();
  } catch (e) {
    console.error('[Budget] Submit error:', e);
    showToast('设置失败: ' + (e.message || '未知错误'), 'error');
  }
}

// ============================================================
//  导出 Excel (CSV)
// ============================================================
function exportExcel() {
  var monthTx = getMonthTransactions();
  if (monthTx.length === 0) {
    showToast('本月暂无数据可导出', 'info');
    return;
  }

  // BOM + CSV
  var bom = '\uFEFF';
  var header = '日期,类型,分类,账户,金额,备注\n';
  var rows = '';
  monthTx.forEach(function(tx) {
    var cat = findCategory(tx.category_id);
    var acc = findAccount(tx.account_id);
    var typeMap = { income: '收入', expense: '支出', transfer: '转账' };
    rows += [
      tx.date || '',
      typeMap[tx.type] || tx.type,
      cat ? cat.name : '',
      acc ? acc.name : '',
      tx.amount || 0,
      '"' + (tx.description || tx.remark || '').replace(/"/g, '""') + '"'
    ].join(',') + '\n';
  });

  var csv = bom + header + rows;
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = currentYear + '年' + currentMonth + '月_记账记录.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('导出成功', 'success');
}

// ============================================================
//  工具函数
// ============================================================
function findCategory(id) {
  if (!id) return null;
  for (var i = 0; i < allCategories.length; i++) {
    if (allCategories[i].id === id) return allCategories[i];
  }
  return null;
}

function findAccount(id) {
  if (!id) return null;
  for (var i = 0; i < allAccounts.length; i++) {
    if (allAccounts[i].id === id) return allAccounts[i];
  }
  return null;
}

function formatNum(n) {
  return parseFloat(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showToast(msg, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(function() {
    if (el.parentNode) el.parentNode.removeChild(el);
  }, 2600);
}

// ============================================================
//  点击 modal overlay 关闭
// ============================================================
document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) {
      overlay.classList.remove('active');
    }
  });
});
